  - id: datadog-dotnet
    tool: datadog
    language: dotnet
    flavour: default
    display_name: .NET
    setup_tier: zero-code
    attach: "CLR profiler env (Datadog.Trace), DD_TRACE_PROPAGATION_STYLE=datadog,tracecontext,baggage"
    tracer: { name: dd-trace-dotnet, registry: github-releases, package: DataDog/dd-trace-dotnet, tag_prefix: v, github: DataDog/dd-trace-dotnet }

    tracer: { name: elastic-apm-dotnet, registry: github-releases, package: elastic/apm-agent-dotnet, github: elastic/apm-agent-dotnet }
    source: relays/dotnet
  - id: elastic-ruby
    tool: elastic
    language: ruby
    flavour: default
    display_name: Ruby
    setup_tier: init-only
    attach: "require 'elastic_apm'; ElasticAPM.start"
    tracer: { name: elastic-apm (gem), registry: rubygems, package: elastic-apm, github: elastic/apm-agent-ruby }
    source: relays/ruby/gemfiles/elastic
  - id: elastic-php
    tool: elastic
    language: php
    flavour: default
    display_name: PHP
    setup_tier: zero-code
    attach: "apm-agent-php .deb (elastic_apm extension)"
    tracer: { name: elastic-apm-php, registry: github-releases, package: elastic/apm-agent-php, github: elastic/apm-agent-php }
    source: relays/php

  # ---- New Relic ----------------------------------------------------------
  - id: newrelic-java
    tool: newrelic
    language: java

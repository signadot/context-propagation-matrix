    setup_tier: zero-code
    attach: "-javaagent:dd-java-agent.jar, DD_TRACE_PROPAGATION_STYLE=datadog,tracecontext,baggage"
    tracer: { name: dd-java-agent, registry: maven, package: "com.datadoghq:dd-java-agent", github: DataDog/dd-trace-java }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/
    source: relays/java
  - id: datadog-java-defaults
    tool: datadog
    language: java
    flavour: defaults
    display_name: Java (defaults)
    setup_tier: zero-code
    attach: "-javaagent:dd-java-agent.jar, propagation style left at agent default"
    tracer: { name: dd-java-agent, registry: maven, package: "com.datadoghq:dd-java-agent", github: DataDog/dd-trace-java }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/
    source: relays/java
  - id: datadog-node
    tool: datadog
    language: node
    flavour: default
    display_name: Node.js
    setup_tier: zero-code
    attach: "--require dd-trace/init"
    tracer: { name: dd-trace, registry: npm, package: dd-trace, github: DataDog/dd-trace-js }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/nodejs/
    source: relays/node/tools/datadog
  - id: datadog-node-defaults
    tool: datadog
    language: node
    flavour: defaults
    display_name: Node.js (defaults)
    setup_tier: zero-code
    attach: "--require dd-trace/init, propagation style left at default"
    tracer: { name: dd-trace, registry: npm, package: dd-trace, github: DataDog/dd-trace-js }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/nodejs/
    source: relays/node/tools/datadog
  - id: datadog-python
    tool: datadog
    language: python
    flavour: default
    display_name: Python
    setup_tier: zero-code
    attach: "ddtrace-run python app.py"
    tracer: { name: ddtrace, registry: pypi, package: ddtrace, github: DataDog/dd-trace-py }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/python/
    source: relays/python
  - id: datadog-python-defaults
    tool: datadog
    language: python
    flavour: defaults
    display_name: Python (defaults)
    setup_tier: zero-code
    attach: "ddtrace-run, propagation style left at default"
    tracer: { name: ddtrace, registry: pypi, package: ddtrace, github: DataDog/dd-trace-py }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/python/
    source: relays/python
  - id: datadog-python-kafkaprop
    tool: datadog
    language: python
    flavour: kafkaprop
    display_name: Python (DD_KAFKA_PROPAGATION_ENABLED)
    setup_tier: zero-code
    attach: "ddtrace-run, DD_KAFKA_PROPAGATION_ENABLED=true"
    tracer: { name: ddtrace, registry: pypi, package: ddtrace, github: DataDog/dd-trace-py }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/python/
    source: relays/python
  - id: datadog-go
    tool: datadog
    language: go
    flavour: default
    display_name: Go
    setup_tier: in-code
    attach: "dd-trace-go contribs (net/http, grpc, sarama) + tracer.Inject/Extract for Kafka; hand-written AMQP carrier"
    tracer: { name: dd-trace-go, registry: goproxy, package: github.com/DataDog/dd-trace-go/v2, github: DataDog/dd-trace-go }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/go/
    source: relays/go/datadog
    legs:
      http:     { inbound: library, outbound: library }
      grpc:     { inbound: library, outbound: library }
      kafka:    { inbound: app,     outbound: app }
      rabbitmq: { inbound: app,     outbound: app }
  - id: datadog-go-defaults
    tool: datadog
    language: go
    flavour: defaults
    display_name: Go (defaults)
    setup_tier: in-code
    attach: "dd-trace-go contribs + tracer.Inject/Extract for Kafka, propagation style left at default"
    tracer: { name: dd-trace-go, registry: goproxy, package: github.com/DataDog/dd-trace-go/v2, github: DataDog/dd-trace-go }
    docs: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/go/
    source: relays/go/datadog
    legs:
      http:     { inbound: library, outbound: library }
      grpc:     { inbound: library, outbound: library }
      kafka:    { inbound: app,     outbound: app }

  - { id: none-python, tool: none, language: python, flavour: default, display_name: Python,  setup_tier: null, source: relays/python }
  - { id: none-go,     tool: none, language: go,     flavour: default, display_name: Go,      setup_tier: null, source: relays/go }
  - { id: none-dotnet, tool: none, language: dotnet, flavour: default, display_name: .NET,    setup_tier: null, source: relays/dotnet }
  - { id: none-ruby,   tool: none, language: ruby,   flavour: default, display_name: Ruby,    setup_tier: null, source: relays/ruby/gemfiles/none }
  - { id: none-php,    tool: none, language: php,    flavour: default, display_name: PHP,     setup_tier: null, source: relays/php }
  - { id: none-rust,   tool: none, language: rust,   flavour: default, display_name: Rust,    setup_tier: null, source: relays/rust }

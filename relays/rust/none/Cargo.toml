# The baseline Rust relay: the shared source in ../src with no tracer
# installed (see ../otel/Cargo.toml for the per-tool layout).
[package]
name = "cpmatrix-relay-none"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
name = "relay"
path = "../src/lib.rs"

[[bin]]
name = "relay-none"
path = "../src/bin/relay-none.rs"

[dependencies]
# Transports (deliberately naive application libraries).
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
# No TLS backend: the sink is plain http, and this keeps the build image lean.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
# cmake-build: compile the vendored librdkafka with cmake (no system lib).
# libz-static: statically link zlib so the runtime image needs nothing extra.
rdkafka = { version = "0.40", features = ["cmake-build", "libz-static", "tokio"] }
# tokio runtime only; no TLS backend needed for plain amqp://.
lapin = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

# No tracer. The shared source calls the OpenTelemetry API, whose globals
# default to no-ops when nothing installs a provider or propagator, so the
# API and HTTP carrier crates are plain application dependencies here, not
# a pin. Nobody moves them automatically: Dependabot ignores them (one cargo
# entry covers all three crates and the tracer crates are ignored there) and
# pins.yaml does not list this crate. Move them by hand with the otel-rust
# pin: a minor is an API change to the shared source and lands in all three
# crates at once.
opentelemetry = "0.33"
opentelemetry-http = "0.33"

[build-dependencies]
# tonic 0.14 moved protobuf codegen out of tonic-build into tonic-prost-build.
tonic-prost-build = "0.14"

[profile.release]
strip = true

<VirtualHost *:8080>
    DocumentRoot /app/public
    # Route every path (including POST /relay) to the Slim front controller.
    FallbackResource /index.php

    <Directory /app/public>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

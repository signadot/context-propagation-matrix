name: cpmatrix

x-relay-common-env: &relay-common-env
  KAFKA_BROKERS: kafka:9092
  SINK_HTTP: http://sink:9080
  SINK_GRPC: sink:9081
  RABBIT_URL: amqp://guest:guest@rabbitmq:5672
  SINK_RABBIT_QUEUE: sink-rmq

x-relay-depends: &relay-depends
  kafka:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  sink:
    condition: service_started

services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  sink:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      target: sink
    environment:
      KAFKA_BROKERS: kafka:9092
      SINK_DATA_FILE: /data/observations.jsonl
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./results/data:/data
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  driver:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      target: driver
    profiles: [driver]
    environment:
      KAFKA_BROKERS: kafka:9092
      SINK_URL: http://sink:9080
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./results/raw:/results
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sink:
        condition: service_started

  # ---------------- Java relays ----------------

  relay-otel-java:
    build:
      context: .
      dockerfile: relays/java/Dockerfile
      target: otel
    profiles: [otel-java]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-java
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-java
      OTEL_SERVICE_NAME: relay-otel-java
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-java:
    build:
      context: .
      dockerfile: relays/java/Dockerfile
      target: datadog
    profiles: [datadog-java]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-java
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-java
      DD_SERVICE: relay-datadog-java
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-java-defaults:
    build:
      context: .
      dockerfile: relays/java/Dockerfile
      target: datadog
    profiles: [datadog-java-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-java-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-java-defaults
      DD_SERVICE: relay-datadog-java-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-java:
    build:
      context: .
      dockerfile: relays/java/Dockerfile
      target: newrelic
    profiles: [newrelic-java]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-java
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-java
      NEW_RELIC_APP_NAME: relay-newrelic-java
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_LOG_FILE_NAME: STDOUT
    depends_on: *relay-depends

  # ---------------- Node relays ----------------

  relay-otel-node:
    build: { context: ., dockerfile: relays/node/Dockerfile, target: otel }
    profiles: [otel-node]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-node
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-node
      OTEL_SERVICE_NAME: relay-otel-node
      # Not `none`: @opentelemetry/sdk-node registers no TracerProvider when
      # no trace exporter is configured, so the relay would forward the seeded
      # headers verbatim (≥0.66.0) or inject nothing (≤0.65.0) without ever
      # starting a span. `console` keeps the SDK live; spans go to stdout.
      OTEL_TRACES_EXPORTER: console
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-node:
    build: { context: ., dockerfile: relays/node/Dockerfile, target: datadog }
    profiles: [datadog-node]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-node
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-node
      DD_SERVICE: relay-datadog-node
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-node-defaults:
    build: { context: ., dockerfile: relays/node/Dockerfile, target: datadog }
    profiles: [datadog-node-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-node-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-node-defaults
      DD_SERVICE: relay-datadog-node-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-node:
    build: { context: ., dockerfile: relays/node/Dockerfile, target: newrelic }
    profiles: [newrelic-node]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-node
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-node
      NEW_RELIC_APP_NAME: relay-newrelic-node
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_LOG: stdout
    depends_on: *relay-depends

  # ---------------- Python relays ----------------

  relay-otel-python:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: otel }
    profiles: [otel-python]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-python
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-python
      OTEL_SERVICE_NAME: relay-otel-python
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-python:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: datadog }
    profiles: [datadog-python]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-python
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-python
      DD_SERVICE: relay-datadog-python
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-python-defaults:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: datadog }
    profiles: [datadog-python-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-python-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-python-defaults
      DD_SERVICE: relay-datadog-python-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  # dd-trace-py gates Kafka header injection behind DD_KAFKA_PROPAGATION_ENABLED;
  # this variant shows behavior with it turned on.
  relay-datadog-python-kafkaprop:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: datadog }
    profiles: [datadog-python-kafkaprop]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-python-kafkaprop
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-python-kafkaprop
      DD_SERVICE: relay-datadog-python-kafkaprop
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_KAFKA_PROPAGATION_ENABLED: "true"
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-python:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: newrelic }
    profiles: [newrelic-python]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-python
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-python
      NEW_RELIC_APP_NAME: relay-newrelic-python
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_LOG: stdout
    depends_on: *relay-depends

  # ---------------- Go relays ----------------

  relay-otel-go:
    build: { context: ., dockerfile: relays/go/Dockerfile, args: { TOOL: otel } }
    profiles: [otel-go]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-go
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-go
      OTEL_SERVICE_NAME: relay-otel-go
      OTEL_TRACES_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  # Same tool, opposite setup: the hand-wired otel-go relay above wires
  # contribs in code; this variant compiles the naive app in relays/go-otelc
  # with the OTel compile-time weaver (`go tool otelc go build`) — zero source
  # changes.
  relay-otel-go-compiletime:
    build: { context: ., dockerfile: relays/go-otelc/Dockerfile }
    profiles: [otel-go-compiletime]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-go-compiletime
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-go-compiletime
      OTEL_SERVICE_NAME: relay-otel-go-compiletime
      # Not `none`: the otelc runtime installs no TracerProvider without an
      # exporter, so the woven app forwarded the seeded headers verbatim and
      # never started a span. `console` keeps the SDK live; spans go to stdout.
      OTEL_TRACES_EXPORTER: console
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-go:
    build: { context: ., dockerfile: relays/go/Dockerfile, args: { TOOL: datadog } }
    profiles: [datadog-go]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-go
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-go
      DD_SERVICE: relay-datadog-go
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-go-defaults:
    build: { context: ., dockerfile: relays/go/Dockerfile, args: { TOOL: datadog } }
    profiles: [datadog-go-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-go-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-go-defaults
      DD_SERVICE: relay-datadog-go-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  # Same tool, opposite setup: the hand-wired datadog-go relay above wires
  # dd-trace-go contribs in code; this variant compiles the naive app in
  # relays/go-orchestrion with Datadog Orchestrion (`orchestrion go build`) —
  # zero source changes. Same propagation config as datadog-go.
  relay-datadog-go-orchestrion:
    build: { context: ., dockerfile: relays/go-orchestrion/Dockerfile }
    profiles: [datadog-go-orchestrion]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-go-orchestrion
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-go-orchestrion
      DD_SERVICE: relay-datadog-go-orchestrion
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-go:
    build: { context: ., dockerfile: relays/go/Dockerfile, args: { TOOL: newrelic } }
    profiles: [newrelic-go]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-go
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-go
      NEW_RELIC_APP_NAME: relay-newrelic-go
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
    depends_on: *relay-depends

  # ---------------- .NET relays ----------------

  relay-otel-dotnet:
    build: { context: ., dockerfile: relays/dotnet/Dockerfile, target: otel }
    profiles: [otel-dotnet]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-dotnet
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-dotnet
      OTEL_SERVICE_NAME: relay-otel-dotnet
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-dotnet:
    build: { context: ., dockerfile: relays/dotnet/Dockerfile, target: datadog }
    profiles: [datadog-dotnet]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-dotnet
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-dotnet
      DD_SERVICE: relay-datadog-dotnet
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-dotnet-defaults:
    build: { context: ., dockerfile: relays/dotnet/Dockerfile, target: datadog }
    profiles: [datadog-dotnet-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-dotnet-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-dotnet-defaults
      DD_SERVICE: relay-datadog-dotnet-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-dotnet:
    build: { context: ., dockerfile: relays/dotnet/Dockerfile, target: newrelic }
    profiles: [newrelic-dotnet]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-dotnet
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-dotnet
      NEW_RELIC_APP_NAME: relay-newrelic-dotnet
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_LOG_CONSOLE: "true"
    depends_on: *relay-depends

  # ---------------- Ruby relays ----------------

  relay-otel-ruby:
    build: { context: ., dockerfile: relays/ruby/Dockerfile, target: otel }
    profiles: [otel-ruby]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: otel-ruby
      TOOL: otel
      RELAY_TOPIC: relay-in-otel-ruby
      OTEL_SERVICE_NAME: relay-otel-ruby
      OTEL_TRACES_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on: *relay-depends

  relay-datadog-ruby:
    build: { context: ., dockerfile: relays/ruby/Dockerfile, target: datadog }
    profiles: [datadog-ruby]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-ruby
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-ruby
      DD_SERVICE: relay-datadog-ruby
      DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-datadog-ruby-defaults:
    build: { context: ., dockerfile: relays/ruby/Dockerfile, target: datadog }
    profiles: [datadog-ruby-defaults]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: datadog-ruby-defaults
      TOOL: datadog
      RELAY_TOPIC: relay-in-datadog-ruby-defaults
      DD_SERVICE: relay-datadog-ruby-defaults
      DD_TRACE_STARTUP_LOGS: "false"
      DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
      DD_REMOTE_CONFIG_ENABLED: "false"
    depends_on: *relay-depends

  relay-newrelic-ruby:
    build: { context: ., dockerfile: relays/ruby/Dockerfile, target: newrelic }
    profiles: [newrelic-ruby]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: newrelic-ruby
      TOOL: newrelic
      RELAY_TOPIC: relay-in-newrelic-ruby
      NEW_RELIC_APP_NAME: relay-newrelic-ruby
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_LOG: stdout
    depends_on: *relay-depends

  # ---------------- Elastic APM relays ----------------
  # No APM Server: agents run with sending disabled (disable_send) where
  # supported; propagation is in-process and does not require a server.

  relay-elastic-java:
    build:
      context: .
      dockerfile: relays/java/Dockerfile
      target: elastic
    profiles: [elastic-java]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-java
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-java
      ELASTIC_APM_SERVICE_NAME: relay-elastic-java
      ELASTIC_APM_DISABLE_SEND: "true"
      ELASTIC_APM_CENTRAL_CONFIG: "false"
    depends_on: *relay-depends

  relay-elastic-node:
    build: { context: ., dockerfile: relays/node/Dockerfile, target: elastic }
    profiles: [elastic-node]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-node
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-node
      ELASTIC_APM_SERVICE_NAME: relay-elastic-node
      ELASTIC_APM_DISABLE_SEND: "true"
      ELASTIC_APM_CENTRAL_CONFIG: "false"
    depends_on: *relay-depends

  relay-elastic-python:
    build: { context: ., dockerfile: relays/python/Dockerfile, target: elastic }
    profiles: [elastic-python]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-python
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-python
      ELASTIC_APM_SERVICE_NAME: relay-elastic-python
      ELASTIC_APM_DISABLE_SEND: "true"
      ELASTIC_APM_CENTRAL_CONFIG: "false"
    depends_on: *relay-depends

  relay-elastic-go:
    build: { context: ., dockerfile: relays/go/Dockerfile, args: { TOOL: elastic } }
    profiles: [elastic-go]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-go
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-go
      ELASTIC_APM_SERVICE_NAME: relay-elastic-go
      ELASTIC_APM_DISABLE_SEND: "true"
      ELASTIC_APM_CENTRAL_CONFIG: "false"
    depends_on: *relay-depends

  relay-elastic-dotnet:
    build: { context: ., dockerfile: relays/dotnet/Dockerfile, target: elastic }
    profiles: [elastic-dotnet]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-dotnet
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-dotnet
      ELASTIC_APM_SERVICE_NAME: relay-elastic-dotnet
      ELASTIC_APM_CENTRAL_CONFIG: "false"
    depends_on: *relay-depends

  relay-elastic-ruby:
    build: { context: ., dockerfile: relays/ruby/Dockerfile, target: elastic }
    profiles: [elastic-ruby]
    restart: on-failure
    environment:
      <<: *relay-common-env
      VARIANT: elastic-ruby
      TOOL: elastic
      RELAY_TOPIC: relay-in-elastic-ruby
      ELASTIC_APM_SERVICE_NAME: relay-elastic-ruby
      ELASTIC_APM_DISABLE_SEND: "true"
      ELASTIC_APM_CENTRAL_CONFIG: "false"

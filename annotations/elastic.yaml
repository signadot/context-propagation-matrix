# Elastic APM — root causes for the non-pass cells of elastic-* variants.
#
# The Java agent (1.56.0) is the only non-OTel agent to carry traceparent,
# tracestate and W3C baggage across all 16 boundaries; its only non-pass cells
# are ot-baggage-* (cross-cutting.yaml). Causes shared with other tools live in
# cross-cutting.yaml: PHP gRPC server absence, PHP gRPC client, ot-baggage-*.
#
# Sources: FINDINGS.md §7 (PHP), §8; REFERENCES.md "Elastic APM".

- id: elastic-go-no-baggage-api
  title: "apm-agent-go has no baggage API, by explicit decision"
  match:
    - tool: elastic
      language: go
      header: baggage
  cause: "Elastic's Go agent carries trace identity on all 16 boundaries but implements no W3C baggage at all; the request was closed not-planned in 2019."
  explanation: |
    `apmhttp`/`apmgrpc` wrappers plus the documented manual traceparent/tracestate
    pattern carry trace identity across all 16 boundaries on apm-agent-go
    v2.7.12, but the agent has no baggage API. This was declined upstream:
    apm-agent-go #537 was closed not-planned ("no plans for baggage at the
    moment"), and `apmot/span.go` states "SetBaggageItem is a no-op; we do not
    support baggage" (`apmot/doc.go`: "Things not implemented by this tracer:
    binary propagation format, baggage, logging"). A repo-wide search hits
    baggage only in the OpenTracing bridge — there is no W3C baggage code.

    This contradicts Elastic's own agent spec ("Agents MUST parse, validate, and
    attach the `baggage` header according to the W3C specification"). A user who
    needs baggage must carry it as an application header on every hop
    themselves.
  status: wontfix
  links:
    - { title: "apm-agent-go #537 (closed not-planned)", url: "https://github.com/elastic/apm-agent-go/issues/537" }
    - { title: "apmot/span.go (SetBaggageItem is a no-op)", url: "https://github.com/elastic/apm-agent-go/blob/main/module/apmot/span.go#L127-L136" }
    - { title: "apmot/doc.go", url: "https://github.com/elastic/apm-agent-go/blob/main/module/apmot/doc.go" }
    - { title: "Elastic agent spec — distributed tracing", url: "https://github.com/elastic/apm/blob/main/specs/agents/tracing-distributed-tracing.md" }

- id: elastic-agents-no-w3c-baggage
  title: "Elastic Node, Python, Ruby and PHP agents do not propagate W3C baggage on any boundary"
  match:
    - tool: elastic
      language: [node, python, ruby]
      header: baggage
    - tool: elastic
      language: php
      header: baggage
      outcome: fail
  cause: "Only Elastic's Java agent (and .NET over HTTP/gRPC) implements the baggage propagation the agent spec mandates; these agents drop it on every boundary."
  explanation: |
    Elastic's agent spec mandates baggage support, but only the Java agent
    delivers it end-to-end. elastic-apm-node 4.18.0 has no W3C baggage
    implementation; elastic-apm (Python) 6.26.2, elastic-apm (Ruby) 4.9.0 and
    elastic_apm (PHP) 1.17.0 measure `baggage` absent on every boundary,
    including `http->http` where `traceparent`/`tracestate` continue. The
    seeded member is neither extracted nor re-emitted.

    Outside Java, Elastic APM cannot currently carry application baggage across
    protocol boundaries; a user must forward the `baggage` header as an
    application header themselves. Elastic's Node distributed-tracing docs
    likewise describe manual `traceparent` passing only (no tracestate or
    baggage). Our references record no upstream issue requesting W3C baggage in
    these agents.
  status: open
  links:
    - { title: "Elastic agent spec — distributed tracing", url: "https://github.com/elastic/apm/blob/main/specs/agents/tracing-distributed-tracing.md" }
    - { title: "Elastic Node.js agent — distributed tracing docs", url: "https://www.elastic.co/docs/reference/apm/agents/nodejs/distributed-tracing" }

- id: elastic-node-amqplib-not-instrumented
  title: "elastic-apm-node does not instrument amqplib; RabbitMQ legs carry nothing"
  match:
    - tool: elastic
      language: node
      header: [tracestate, traceparent]
      boundary: ["*->rabbitmq", "rabbitmq->*"]
  cause: "amqplib is absent from the Node agent's supported technologies; long-standing requests (#1188, #1791) have been open since 2019/2020."
  explanation: |
    elastic-apm-node 4.18.0 propagates `traceparent` and `tracestate` over
    HTTP, gRPC and kafkajs, but amqplib is absent from the supported-technologies
    page, so nothing is injected on `*->rabbitmq` and nothing is extracted on
    `rabbitmq->*`. Elastic's docs direct queue users to manual `traceparent`
    passing (the recipe carries `traceparent` only).

    The amqplib requests #1188 (Jul 2019) and #1791 (Jul 2020) remain open.
    Workaround: pass `traceparent`/`tracestate` in message headers yourself and
    start the consumer transaction with the received `traceparent`.
  status: open
  links:
    - { title: "Elastic Node.js agent — supported technologies", url: "https://www.elastic.co/docs/reference/apm/agents/nodejs/supported-technologies" }
    - { title: "Elastic Node.js agent — distributed tracing docs", url: "https://www.elastic.co/docs/reference/apm/agents/nodejs/distributed-tracing" }
    - { title: "apm-agent-nodejs #1188", url: "https://github.com/elastic/apm-agent-nodejs/issues/1188" }
    - { title: "apm-agent-nodejs #1791", url: "https://github.com/elastic/apm-agent-nodejs/issues/1791" }

- id: elastic-python-grpc-tracestate-key-bug
  title: "elastic-apm Python: gRPC server interceptor assigns the tracestate header name instead of its value"
  match:
    - tool: elastic
      language: python
      header: tracestate
      boundary: ["grpc->http", "grpc->grpc"]
  cause: "server_interceptor.py has `tracestate = metadata.key`, so after a gRPC hop the outbound tracestate is the literal string 'tracestate'; foreign entries are lost."
  explanation: |
    gRPC-inbound continues the trace (`traceparent` passes) but drops foreign
    `tracestate` entries: the outbound `tracestate` header emitted after a gRPC
    hop is the literal string `tracestate`. The root cause is a one-line bug in
    `elasticapm/contrib/grpc/server_interceptor.py` (v6.26.2, lines 66–73):
    `elif metadata.key == "tracestate": tracestate = metadata.key` — the header
    *name* is assigned instead of its value. Still unfixed on main (file last
    touched Oct 2023).

    Bonus finding for the same report: the async variant
    (`async_server_interceptor.py`) never reads `invocation_metadata` at all, so
    the async gRPC server path does not extract trace context, period.

    Unreported upstream — filing candidate with the one-line fix
    (`metadata.key` → `metadata.value`). This is the only tracestate corruption
    observed among all tracers that continued a trace.
  status: open
  links:
    - { title: "apm-agent-python server_interceptor.py @ v6.26.2 L66-L73", url: "https://github.com/elastic/apm-agent-python/blob/v6.26.2/elasticapm/contrib/grpc/server_interceptor.py#L66-L73" }
    - { title: "apm-agent-python server_interceptor.py @ main (still unfixed)", url: "https://github.com/elastic/apm-agent-python/blob/main/elasticapm/contrib/grpc/server_interceptor.py#L70-L71" }

- id: elastic-python-no-confluent-kafka-or-pika
  title: "elastic-apm Python has no confluent-kafka or pika instrumentation"
  match:
    - tool: elastic
      language: python
      header: [tracestate, traceparent]
      boundary: ["*->kafka", "*->rabbitmq", "kafka->*", "rabbitmq->*"]
  cause: "The Python agent's only messaging client is kafka-python; confluent-kafka and pika are uninstrumented: nothing is injected, consumers start no transaction."
  explanation: |
    The Python supported-technologies page lists `kafka-python` (>=2.0,<3) as
    its only messaging client; confluent-kafka and pika appear nowhere. On
    elastic-apm 6.26.2 nothing is injected into produced Kafka records or
    published AMQP messages, and consumers start no transaction — so even the
    outbound HTTP/gRPC calls after a consume carry no headers at all (absent,
    not a new trace).

    RabbitMQ has been requested since Dec 2019 (#678: "It would be of high value
    to add instrumentation and distributed tracing for message brokers and, in
    particular, RabbitMQ"), still open. Workaround: start a transaction manually
    in the consumer with the received `traceparent` and inject headers manually
    on produce/publish.
  status: open
  links:
    - { title: "Elastic Python agent — supported technologies", url: "https://www.elastic.co/docs/reference/apm/agents/python/supported-technologies" }
    - { title: "apm-agent-python #678 (RabbitMQ request, open since 2019)", url: "https://github.com/elastic/apm-agent-python/issues/678" }

- id: elastic-dotnet-kafka-profiler-deployment-only
  title: "Elastic .NET: Kafka instrumentation exists only in the CLR-profiler deployment, not the startup hook"
  match:
    - tool: elastic
      language: dotnet
      header: [baggage, tracestate, traceparent]
      boundary: ["*->kafka", "kafka->*"]
  cause: "The startup-hook zero-code deployment covers neither Kafka nor RabbitMQ; the profiler that does is x64-only and caps at Confluent.Kafka <3.0.0."
  explanation: |
    elastic-apm-dotnet 1.34.7 with the startup-hook zero-code deployment passes
    HTTP and gRPC including baggage. Kafka and RabbitMQ are the only rows in the
    profiler docs' technology table without the startup-hook marker: the agent's
    own messaging instrumentation exists only in the CLR-profiler deployment,
    which is x64-only on Windows and Linux ("ARM and 32-bit processes are not
    supported") and even then caps at `Confluent.Kafka >=1.4.0 <3.0.0` and
    `RabbitMQ.Client >=3.6.9 <7.0.0`.

    Confluent.Kafka has no native `ActivitySource` for the agent's OpenTelemetry
    bridge to pick up, so Kafka measures fully absent: `*->kafka` injects
    nothing and `kafka->*` starts a new trace. (RabbitMQ trace context still
    flows via RabbitMQ.Client 7.x's native ActivitySource — see
    `elastic-dotnet-rabbitmq-native-no-baggage` for the baggage half.)

    Workaround: inject/extract `traceparent`/`tracestate` manually around
    Confluent.Kafka produce and consume using the agent's public API.
  status: by-design
  links:
    - { title: "Elastic .NET profiler auto-instrumentation docs", url: "https://www.elastic.co/docs/reference/apm/agents/dotnet/setup-auto-instrumentation" }

- id: elastic-dotnet-rabbitmq-native-no-baggage
  title: "Elastic .NET: RabbitMQ trace context flows via the client's native ActivitySource, but consume drops baggage"
  match:
    # Only the consume side fails: baggage passes on http->rabbitmq and
    # grpc->rabbitmq (see the explanation).
    - tool: elastic
      language: dotnet
      header: baggage
      boundary: ["rabbitmq->http", "rabbitmq->grpc", "rabbitmq->rabbitmq"]
  cause: "The Elastic agent has no RabbitMQ.Client 7 instrumentation; the client's own default consume path restores trace id and tracestate only, never baggage."
  explanation: |
    `*->rabbitmq` injection and `rabbitmq->*` continuation both pass for
    `traceparent`/`tracestate` on elastic-apm-dotnet 1.36.0 — not because the
    agent instruments RabbitMQ (its own instrumentation is profiler-only and
    caps at `RabbitMQ.Client <7.0.0`), but because RabbitMQ.Client 7.x ships
    native `ActivitySource` instrumentation (PR #1261) that the agent's
    OpenTelemetry bridge picks up.

    Baggage is split by direction. On publish it passes: `http->rabbitmq` and
    `grpc->rabbitmq` deliver the seeded baggage in the AMQP headers (re-spaced
    as `key = value, key = value`, which the scoring accepts). It was absent on
    those legs until run-2026-11-10.5, the first run on .NET 10 with the agent
    unchanged at 1.36.0 (previously .NET 8). On consume it does not: on
    `rabbitmq->*` the trace and tracestate continue but no `baggage` header is
    sent onward. The native consume path cannot restore it: its
    `DefaultContextExtractor` calls `ExtractTraceIdAndState(...)` only. Baggage
    was addressed via an opt-in package (PR #1528) that has never shipped stable
    (#1728, open since Nov 2024). Workaround: read `baggage` from the AMQP
    message properties yourself in the consumer.
  status: open
  links:
    - { title: "Elastic .NET profiler auto-instrumentation docs", url: "https://www.elastic.co/docs/reference/apm/agents/dotnet/setup-auto-instrumentation" }
    - { title: "rabbitmq-dotnet-client PR #1261 (native ActivitySource)", url: "https://github.com/rabbitmq/rabbitmq-dotnet-client/pull/1261" }
    - { title: "rabbitmq-dotnet-client PR #1528 (opt-in baggage package)", url: "https://github.com/rabbitmq/rabbitmq-dotnet-client/pull/1528" }
    - { title: "rabbitmq-dotnet-client #1728", url: "https://github.com/rabbitmq/rabbitmq-dotnet-client/issues/1728" }

- id: elastic-ruby-grpc-manual-only
  title: "Elastic Ruby: gRPC support is experimental and manual, with no zero-code client or server path"
  match:
    - tool: elastic
      language: ruby
      header: [tracestate, traceparent]
      boundary: ["*->grpc", "grpc->*"]
  cause: "The Ruby agent instruments gRPC only via a hand-added ClientInterceptor at stub creation; the init-only setup adds none, and there is no server-side path."
  explanation: |
    elastic-apm (Ruby) 4.9.0 passes `http->http` only. gRPC support exists but
    is experimental and manual: "To instrument a client, add the
    `ElasticAPM::GRPC::ClientInterceptor` as an `interceptor` at Stub creation".
    The harness's init-only setup (`require 'elastic_apm'; ElasticAPM.start`)
    adds no interceptor, so `*->grpc` carries nothing, and with no server-side
    instrumentation `grpc->*` runs with no transaction and injects nothing on
    the outbound leg.

    What a user can do: wire the client interceptor into every stub. Nothing
    documented covers the server side. The accurate claim is "no zero-code
    gRPC", not "no gRPC at all".
  status: open
  links:
    - { title: "Elastic Ruby agent — supported technologies", url: "https://www.elastic.co/docs/reference/apm/agents/ruby/supported-technologies" }

- id: elastic-ruby-no-client-kafka-or-bunny
  title: "Elastic Ruby: no bunny or client-level Kafka instrumentation, and the Racecar spy never reads headers"
  match:
    - tool: elastic
      language: ruby
      header: [tracestate, traceparent]
      boundary: ["*->kafka", "*->rabbitmq", "kafka->*", "rabbitmq->*"]
  cause: "The Ruby agent covers Kafka only via Racecar (whose spy never reads a trace_parent) and RabbitMQ only via Sneakers; rdkafka and bunny are uninstrumented."
  explanation: |
    Nothing is injected on `*->kafka` or `*->rabbitmq` and nothing is extracted
    on `kafka->*` or `rabbitmq->*` on elastic-apm (Ruby) 4.9.0. The supported
    technologies page lists RabbitMQ only as "Sneakers (Experimental)" and no
    Kafka client library at all; Kafka is covered only via the Racecar
    framework.

    Even under Racecar, consume-side continuation is impossible: the racecar spy
    (`lib/elastic_apm/spies/racecar.rb`, added by PR #1284) calls
    `ElasticAPM.start_transaction(kind, TYPE)` with no `trace_parent`, so it
    never reads message headers.

    No upstream issues request bunny or client-level Kafka (rdkafka/ruby-kafka)
    instrumentation. Workaround: inject `traceparent`/`tracestate` into message
    headers manually and start the consumer transaction with the received
    `trace_parent`.
  status: open
  links:
    - { title: "Elastic Ruby agent — supported technologies", url: "https://www.elastic.co/docs/reference/apm/agents/ruby/supported-technologies" }
    - { title: "apm-agent-ruby racecar.rb spy (no trace_parent)", url: "https://github.com/elastic/apm-agent-ruby/blob/main/lib/elastic_apm/spies/racecar.rb" }
    - { title: "apm-agent-ruby PR #1284", url: "https://github.com/elastic/apm-agent-ruby/pull/1284" }

- id: elastic-php-messaging-not-supported
  title: "Elastic PHP: Kafka and RabbitMQ are not supported technologies; only http->http propagates"
  match:
    - tool: elastic
      language: php
      header: [tracestate, traceparent]
      boundary: ["http->kafka", "http->rabbitmq", "kafka->*", "rabbitmq->*"]
  cause: "elastic_apm instruments neither rdkafka nor php-amqplib: nothing is injected on produce/publish and consumed messages start a fresh trace on the outbound leg."
  explanation: |
    On elastic_apm 1.17.0 (PHP 8.3, Apache mod_php + CLI workers) only
    `http->http` propagates `traceparent`/`tracestate`. Kafka and RabbitMQ are
    not in the agent's supported-technologies list: `http->kafka` and
    `http->rabbitmq` inject nothing, and the CLI consumers do not extract, so
    `kafka->http` and `rabbitmq->http` start a fresh trace (new trace-id, the
    foreign tracestate entry lost) while `kafka->kafka`, `kafka->rabbitmq`,
    `rabbitmq->kafka` and `rabbitmq->rabbitmq` carry nothing.

    gRPC-outbound legs are covered separately (`php-grpc-client-not-instrumented`)
    and gRPC-inbound is undeliverable in this topology (`php-no-grpc-server`).
    Our references cite no upstream issue for PHP messaging support in this
    agent.
  status: open

# pins.yaml — where every tracer/agent version is pinned, and how to move it.
# The pins themselves stay in the manifests next to each relay (go.mod,
# package.json, requirements-*.txt, Gemfile, Cargo.toml, Dockerfile ARGs);
# this file only says where they are. Read by `go run ./cmd/cpm pins`:
#
#   cpm pins latest [-only id] [-apply]
#                                  bump-agents.yml: for every entry, whatever
#                                  its kind, look up the newest stable version
#                                  in `source` and (with -apply) rewrite the
#                                  pin; one PR per entry (branch bump/<id>).
#                                  Dependabot ignores every package listed
#                                  here (.github/dependabot.yml), so this is
#                                  the only thing that moves a tracer.
#   cpm pins set -variant V -version X
#                                  backtest.yml: set the pin behind variant V to
#                                  X in a scratch checkout, then build the
#                                  unchanged Dockerfiles. Same edit a Dependabot
#                                  PR would make, pointed backwards.
#   cpm pins check                 verify.yml: every entry resolves to a current
#                                  version in its file, and every instrumented
#                                  variant in variants.yaml has exactly one entry
#                                  whose `source` is its tracer coordinate.
#
# Fields
#   id        stable name (bump branch names, PR titles)
#   kind      how the pin is written — arg | gomod | npm | pip | bundler | cargo
#   source    registry + package (+ tag_prefix), the same coordinates as
#             variants.yaml `tracer` (that equality is how a variant finds its pin)
#   variants  registry variants built from this pin (PR bodies; cross-checked)
#   kind: arg      file + arg (`ARG NAME=<version>`) or pattern (regex with a
#                  named group `version`; the first match is rewritten)
#   kind: gomod    dir + modules: the vendor's version-locked family, `go get`
#                  together then `go mod tidy`. Modules with their own version
#                  line (otelhttp/otelgrpc, New Relic integrations, OTel Ruby
#                  instrumentation gems) are deliberately not listed.
#   kind: npm      file (package.json) + packages
#   kind: pip      file (requirements-*.txt) + packages (globs; every `pkg==`)
#   kind: bundler  file (Gemfile) + packages (gem names)
#   kind: cargo    dir + packages (crates): Cargo.toml requirement set exact
#                  and Cargo.lock moved with `cargo update`, so the
#                  Dockerfile's `--locked` build still applies. Optional
#                  follow { dep: [crates] }: when the pinned crate is moved,
#                  the listed crates' requirements are set to the one the
#                  pinned release declares on dep (crates.io reports it), so
#                  a tracer that requires the OTel API crate exactly and the
#                  relay's own use of it resolve to one copy. `check` also
#                  requires one copy of each pinned and followed crate in
#                  Cargo.lock: a second copy splits the OTel API crate and
#                  the relay stops propagating (relays/rust/README.md).
#   backtest  optional { min: X, skip: [Y, …] }: versions `cpm discover` must
#             not propose — older than min, or listed — because they cannot be
#             built or measured. Say why in a comment next to it.

pins:
  # ---- Java agent jars (Dockerfile ARGs) ---------------------------------
  - id: otel-java-agent
    kind: arg
    file: relays/java/Dockerfile
    arg: OTEL_JAVA_AGENT_VERSION
    source: { registry: maven, package: "io.opentelemetry.javaagent:opentelemetry-javaagent" }
    variants: [otel-java]
    # Agents before 2.15.0 instrument logback with a virtual field the
    # relay's logback (Spring Boot 3.5) no longer has, so the app dies at
    # boot with NoSuchFieldError. (Back-test 2026-11-10: 2.13.0–2.14.0
    # fail, 2.15.0 runs.)
    backtest: { min: 2.15.0 }
  - id: dd-java-agent
    kind: arg
    file: relays/java/Dockerfile
    arg: DD_JAVA_AGENT_VERSION
    source: { registry: maven, package: "com.datadoghq:dd-java-agent" }
    variants: [datadog-java, datadog-java-defaults]
  - id: newrelic-java-agent
    kind: arg
    file: relays/java/Dockerfile
    arg: NEWRELIC_JAVA_AGENT_VERSION
    source: { registry: maven, package: "com.newrelic.agent.java:newrelic-agent" }
    variants: [newrelic-java]
  - id: elastic-java-agent
    kind: arg
    file: relays/java/Dockerfile
    arg: ELASTIC_APM_JAVA_AGENT_VERSION
    source: { registry: maven, package: "co.elastic.apm:elastic-apm-agent" }
    variants: [elastic-java]

  # ---- .NET profilers (Dockerfile ARGs) ----------------------------------
  - id: otel-dotnet-auto
    kind: arg
    file: relays/dotnet/Dockerfile
    arg: OTEL_DOTNET_AUTO_VERSION
    source: { registry: github-releases, package: open-telemetry/opentelemetry-dotnet-instrumentation, tag_prefix: v }
    variants: [otel-dotnet]
  - id: dd-dotnet-tracer
    kind: arg
    file: relays/dotnet/Dockerfile
    arg: DD_DOTNET_TRACER_VERSION
    source: { registry: github-releases, package: DataDog/dd-trace-dotnet, tag_prefix: v }
    variants: [datadog-dotnet, datadog-dotnet-defaults]
  - id: newrelic-dotnet-agent
    kind: arg
    file: relays/dotnet/Dockerfile
    arg: NEWRELIC_DOTNET_AGENT_VERSION
    source: { registry: github-releases, package: newrelic/newrelic-dotnet-agent, tag_prefix: v }
    variants: [newrelic-dotnet]
  - id: elastic-dotnet-agent
    kind: arg
    file: relays/dotnet/Dockerfile
    arg: ELASTIC_APM_DOTNET_VERSION
    source: { registry: github-releases, package: elastic/apm-agent-dotnet, tag_prefix: v }
    variants: [elastic-dotnet]

  # ---- PHP (Dockerfile RUN lines) -----------------------------------------
  # otel-php's tracer coordinate is the extension; the composer packages are
  # companions that bump-agents moves on their own cadence.
  - id: otel-php-ext
    kind: arg
    file: relays/php/Dockerfile
    pattern: 'install-php-extensions opentelemetry-(?<version>[\d.]+)'
    source: { registry: pecl, package: opentelemetry }
    variants: [otel-php]
  - id: otel-php-auto-slim
    kind: arg
    file: relays/php/Dockerfile
    pattern: 'open-telemetry/opentelemetry-auto-slim:(?<version>[\d.]+)'
    source: { registry: packagist, package: open-telemetry/opentelemetry-auto-slim }
    variants: [otel-php]
  - id: otel-php-auto-curl
    kind: arg
    file: relays/php/Dockerfile
    pattern: 'open-telemetry/opentelemetry-auto-curl:(?<version>[\d.]+)'
    source: { registry: packagist, package: open-telemetry/opentelemetry-auto-curl }
    variants: [otel-php]
  - id: otel-php-auto-rdkafka
    kind: arg
    file: relays/php/Dockerfile
    pattern: 'open-telemetry/opentelemetry-auto-ext-rdkafka:(?<version>[\d.]+)'
    source: { registry: packagist, package: open-telemetry/opentelemetry-auto-ext-rdkafka }
    variants: [otel-php]
  - id: dd-php-tracer
    kind: arg
    file: relays/php/Dockerfile
    arg: DD_PHP_TRACER_VERSION
    source: { registry: github-releases, package: DataDog/dd-trace-php }
    variants: [datadog-php]
  - id: newrelic-php-agent
    kind: arg
    file: relays/php/Dockerfile
    arg: NEWRELIC_PHP_AGENT_VERSION
    source: { registry: newrelic-download, package: php_agent }
    variants: [newrelic-php]
  - id: elastic-php-agent
    kind: arg
    file: relays/php/Dockerfile
    arg: ELASTIC_APM_PHP_VERSION
    source: { registry: github-releases, package: elastic/apm-agent-php, tag_prefix: v }
    variants: [elastic-php]
    # The relay image is php:8.3; agent releases before 1.13.0 support PHP
    # 7.2–8.2 only and their .deb post-install refuses to install.
    # (Back-test 2026-11-09: 1.8.3–1.12.0 fail, 1.13.0 builds.)
    backtest: { min: 1.13.0 }

  # ---- Go (go.mod module families; one module per tool under relays/go,
  #      so pinning one tracer never moves another) -------------------------
  - id: otel-go
    kind: gomod
    dir: relays/go/otel
    modules:
      - go.opentelemetry.io/otel
      - go.opentelemetry.io/otel/sdk
      - go.opentelemetry.io/otel/trace
    source: { registry: goproxy, package: go.opentelemetry.io/otel }
    variants: [otel-go]
    # The relay's gRPC legs use the otelgrpc stats handlers
    # (NewServerHandler / NewClientHandler), which arrived in otelgrpc
    # v0.45.0 = otel 1.19.0; 1.16.0–1.18.0 do not compile.
    # (Local pin trial 2026-11-10 after the per-tool module split.)
    backtest: { min: 1.19.0 }
  - id: otelc
    kind: gomod
    dir: relays/go-otelc
    modules: [go.opentelemetry.io/otelc]
    source: { registry: goproxy, package: go.opentelemetry.io/otelc }
    variants: [otel-go-compiletime]
    # 1.0.0: `go tool otelc go build` fails on the relay; 0.x: no such
    # module version at this path. (Back-test 2026-11-01.)
    backtest: { min: 1.0.1 }
  - id: dd-trace-go
    kind: gomod
    dir: relays/go/datadog
    modules:
      - github.com/DataDog/dd-trace-go/v2
      - github.com/DataDog/dd-trace-go/contrib/net/http/v2
      - github.com/DataDog/dd-trace-go/contrib/google.golang.org/grpc/v2
      - github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2
    source: { registry: goproxy, package: github.com/DataDog/dd-trace-go/v2 }
    variants: [datadog-go, datadog-go-defaults]
    # The contrib modules were not tagged for these core releases (no
    # contrib/net/http/v2.1.0 etc.), so the family cannot move together.
    # (Back-test 2026-11-10; 2.0.1 and 2.2.2 build.)
    backtest: { skip: [2.1.0, 2.2.0, 2.2.1] }
  - id: dd-trace-go-orchestrion
    kind: gomod
    dir: relays/go-orchestrion
    modules:
      - github.com/DataDog/dd-trace-go/orchestrion/all/v2
      - github.com/DataDog/dd-trace-go/v2
    source: { registry: goproxy, package: github.com/DataDog/dd-trace-go/v2 }
    variants: [datadog-go-orchestrion]
    # orchestrion/all has no v2.1.0, v2.2.0 or v2.2.1 tag either.
    # (Back-test 2026-11-10; 2.0.1 and 2.2.2 build.)
    backtest: { skip: [2.1.0, 2.2.0, 2.2.1] }
  - id: newrelic-go-agent
    kind: gomod
    dir: relays/go/newrelic
    modules: [github.com/newrelic/go-agent/v3]
    source: { registry: goproxy, package: github.com/newrelic/go-agent/v3 }
    variants: [newrelic-go]
    # The v3.43.0 tag's go.mod requires integrations/nrsecurityagent at a
    # placeholder version (v0.0.0-00010101000000-000000000000), so `go get`
    # cannot resolve it. (Back-test 2026-11-09; 3.42.0 and 3.43.1 build.)
    # Below 3.35.0 the relay does not compile: nramqp.PublishWithContext
    # gained its current arguments in 3.35.0 and the relay calls that form.
    # (Back-test 2026-11-10: 3.27.0–3.34.0 fail, 3.35.0 builds.)
    backtest: { min: 3.35.0, skip: [3.43.0] }
  - id: elastic-apm-go
    kind: gomod
    dir: relays/go/elastic
    modules:
      - go.elastic.co/apm/v2
      - go.elastic.co/apm/module/apmgrpc/v2
      - go.elastic.co/apm/module/apmhttp/v2
    source: { registry: goproxy, package: go.elastic.co/apm/v2 }
    variants: [elastic-go]
    # 2.6.1 was tagged for go.elastic.co/apm/v2 alone; the apmgrpc and
    # apmhttp modules have no v2.6.1, so the family cannot move together.
    # (Back-test 2026-11-09; 2.6.0 and 2.6.2 build.)
    backtest: { skip: [2.6.1] }

  # ---- Node (one single-dependency manifest per tool) --------------------
  - id: otel-node
    kind: npm
    file: relays/node/tools/otel/package.json
    packages: ["@opentelemetry/auto-instrumentations-node"]
    source: { registry: npm, package: "@opentelemetry/auto-instrumentations-node" }
    variants: [otel-node]
  - id: dd-trace-node
    kind: npm
    file: relays/node/tools/datadog/package.json
    packages: [dd-trace]
    source: { registry: npm, package: dd-trace }
    variants: [datadog-node, datadog-node-defaults]
  - id: newrelic-node
    kind: npm
    file: relays/node/tools/newrelic/package.json
    packages: [newrelic]
    source: { registry: npm, package: newrelic }
    variants: [newrelic-node]
  - id: elastic-apm-node
    kind: npm
    file: relays/node/tools/elastic/package.json
    packages: [elastic-apm-node]
    source: { registry: npm, package: elastic-apm-node }
    variants: [elastic-node]

  # ---- Python (one requirements file per tool) ---------------------------
  - id: otel-python
    kind: pip
    file: relays/python/requirements-otel.txt
    packages: ["opentelemetry-*"]      # distro + instrumentation-* share a version line
    source: { registry: pypi, package: opentelemetry-distro }
    variants: [otel-python]
    # opentelemetry-instrument before 0.49b0 imports pkg_resources, which
    # the relay's python:3.12 image does not ship (setuptools is no longer
    # preinstalled), so the relay never starts. Installing setuptools in
    # the image would lift this. (Back-test 2026-11-10: 0.47b0–0.48b0
    # fail, 0.49b0 runs.)
    backtest: { min: 0.49b0 }
  - id: ddtrace
    kind: pip
    file: relays/python/requirements-datadog.txt
    packages: [ddtrace]
    source: { registry: pypi, package: ddtrace }
    variants: [datadog-python, datadog-python-defaults, datadog-python-kafkaprop]
  - id: newrelic-python
    kind: pip
    file: relays/python/requirements-newrelic.txt
    packages: [newrelic]
    source: { registry: pypi, package: newrelic }
    variants: [newrelic-python]
  - id: elastic-apm-python
    kind: pip
    file: relays/python/requirements-elastic.txt
    packages: [elastic-apm]
    source: { registry: pypi, package: elastic-apm }
    variants: [elastic-python]
    # Releases up to 6.13.0 have no wheel for the relay's Python and their
    # setup.py imports pkg_resources, which the isolated build environment's
    # setuptools no longer provides. (Back-test 2026-11-10: 6.9.1–6.13.0
    # fail, 6.13.1 builds.)
    backtest: { min: 6.13.1 }

  # ---- Ruby (one Gemfile per tool) ----------------------------------------
  - id: otel-ruby
    kind: bundler
    file: relays/ruby/gemfiles/otel/Gemfile
    packages: [opentelemetry-sdk]
    source: { registry: rubygems, package: opentelemetry-sdk }
    variants: [otel-ruby]
    # The Gemfile also pins the instrumentation gems (net_http 0.29.0 and
    # friends), which require opentelemetry-common ~> 0.21; opentelemetry-sdk
    # below 1.3.0 requires common ~> 0.19.3, so bundler cannot resolve the
    # pair. Measuring older SDKs needs the instrumentation gems moved with
    # the SDK. (Back-test 2026-11-09: 1.0.2–1.2.1 fail, 1.3.0 builds.)
    backtest: { min: 1.3.0 }
  - id: datadog-ruby
    kind: bundler
    file: relays/ruby/gemfiles/datadog/Gemfile
    packages: [datadog]
    source: { registry: rubygems, package: datadog }
    variants: [datadog-ruby, datadog-ruby-defaults]
    # The relay enables the waterdrop integration, which the gem added in
    # 2.23.0; older gems raise InvalidIntegrationError in Datadog.configure
    # and the relay never starts. A version-conditional integration list
    # would lift this. (Back-test 2026-11-10: 2.18.0–2.22.0 fail, 2.23.0
    # runs.)
    backtest: { min: 2.23.0 }
  - id: newrelic-ruby
    kind: bundler
    file: relays/ruby/gemfiles/newrelic/Gemfile
    packages: [newrelic_rpm]
    source: { registry: rubygems, package: newrelic_rpm }
    variants: [newrelic-ruby]
  - id: elastic-apm-ruby
    kind: bundler
    file: relays/ruby/gemfiles/elastic/Gemfile
    packages: [elastic-apm]
    source: { registry: rubygems, package: elastic-apm }
    variants: [elastic-ruby]

  # ---- Rust (Cargo.toml + Cargo.lock, one crate per tool) -----------------
  # Each Rust relay is its own crate, relays/rust/<tool>, with its own
  # Cargo.lock over the shared source in relays/rust/src — so the two pins
  # move independently (relays/rust/README.md).
  - id: otel-rust
    kind: cargo
    dir: relays/rust/otel
    packages: [opentelemetry, opentelemetry_sdk, opentelemetry-http]
    source: { registry: crates, package: opentelemetry }
    variants: [otel-rust]
    # The three crates move in lockstep except for point releases of one of
    # them: opentelemetry 0.29.1 has no opentelemetry-http 0.29.1, so the
    # exact family requirement cannot resolve. (Back-test 2026-11-01.)
    # The relay source is written to the 0.28 API (opentelemetry_sdk 0.28
    # renamed TracerProvider to SdkTracerProvider); 0.27 and older fail to
    # compile, and 0.27.1 also has no opentelemetry-http 0.27.1. Measuring
    # them needs version-conditional relay source. (Back-test 2026-11-09:
    # 0.22.0–0.27.1 fail, 0.28.0 builds.)
    backtest: { min: 0.28.0, skip: [0.29.1] }
  - id: datadog-rust
    kind: cargo
    dir: relays/rust/datadog
    packages: [datadog-opentelemetry]
    # datadog-opentelemetry is built against one opentelemetry release and
    # requires it (=0.33.0 at 0.6.0, ^0.32.0 at 0.5.x, ^0.31.0 at 0.1–0.4);
    # the relay's own API and HTTP-carrier crates take that requirement so
    # Cargo.lock holds one copy and the Datadog propagator is the one the
    # relay calls. (The 2026-11-01 back-tests of 0.3.2–0.4.0 were measured
    # with two copies and show 0/16 for that reason; re-run after the split.)
    follow:
      opentelemetry: [opentelemetry, opentelemetry-http]
    source: { registry: crates, package: datadog-opentelemetry }
    variants: [datadog-rust]
    # 0.1.0–0.2.1 no longer build: their libdd-trace-utils (Datadog's own
    # dependency) fails to compile against the prost it resolves to
    # (`AgentPayload: Message` not satisfied). 0.0.0 is an empty name
    # reservation. (Back-test 2026-11-10: 0.1.0–0.2.1 fail, 0.3.0 builds.)
    backtest: { min: 0.3.0 }

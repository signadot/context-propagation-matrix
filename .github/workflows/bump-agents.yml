# bump-agents.yml — Dependabot for the versions Dependabot cannot see.
#
# Java agent jars, .NET profiler tarballs, the PHP agents and the OTel PHP
# extension are pinned as Dockerfile ARGs / RUN lines (the `kind: arg` entries
# of pins.yaml). Daily, look up the latest stable version of each in its
# registry and open one PR per newer agent (`cpm pins latest`). Merging a PR
# touches relays/**, which triggers
# matrix.yml → new release → site rebuild → changelog entry.
name: bump-agents

on:
  schedule:
    - cron: '41 5 * * *' # daily 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      bumps: ${{ steps.find.outputs.bumps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./cmd/cpm pins latest > bumps.json
          echo "bumps=$(jq -c . bumps.json)" >> "$GITHUB_OUTPUT"
          echo "Proposed bumps:"; jq -r '.[] | "  \(.id): \(.from) -> \(.to)"' bumps.json

  pr:
    needs: discover
    if: needs.discover.outputs.bumps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        bump: ${{ fromJson(needs.discover.outputs.bumps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply ${{ matrix.bump.id }} ${{ matrix.bump.from }} → ${{ matrix.bump.to }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/cpm pins latest -only "${{ matrix.bump.id }}" -apply >/dev/null
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bump/${{ matrix.bump.id }}-${{ matrix.bump.to }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists; skipping"; exit 0
          fi
          git config user.name "matrix-bot"
          git config user.email "matrix-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "bump(${{ matrix.bump.id }}): ${{ matrix.bump.from }} -> ${{ matrix.bump.to }}"
          git push -u origin "$BRANCH"
          variants='${{ join(matrix.bump.variants, ', ') }}'
          gh pr create --base main --head "$BRANCH" \
            --title "bump(${{ matrix.bump.id }}): ${{ matrix.bump.from }} → ${{ matrix.bump.to }}" \
            --label dependencies \
            --body "$(cat <<EOF
          Bumps **${{ matrix.bump.id }}** from \`${{ matrix.bump.from }}\` to \`${{ matrix.bump.to }}\`
          in \`${{ matrix.bump.file }}\`.

          Source: \`${{ matrix.bump.source.registry }}\` / \`${{ matrix.bump.source.package }}\`
          Affected variants: ${variants}

          Merging re-runs the matrix (\`matrix.yml\`), publishes a new release and
          rebuilds contextpropagation.io. Check the run summary's **Changes** section
          for cells that flipped.

          _Opened automatically by \`bump-agents.yml\`._
          EOF
          )"

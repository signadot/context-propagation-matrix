# bump-agents.yml — every tracer/agent pin, moved by `cpm pins latest`.
#
# Dependabot keeps the app dependencies and the toolchain images; the tracer
# pins listed in pins.yaml (Dockerfile ARGs, go.mod families, package.json,
# requirements-*.txt, Gemfile, Cargo.toml) are Dependabot-ignored
# (.github/dependabot.yml) and moved here instead. Every 6 hours: look up the
# newest stable version of each pin in its registry (`cpm pins latest`) and
# keep exactly ONE open PR per pin, on branch `bump/<id>`, labelled
# tracer-bump + auto-merge + dependencies + the language label Dependabot
# gives that language's PRs (python, javascript, .NET, …, so `label:python`
# finds every PR that moved the Python relays), with squash auto-merge
# requested.
# A newer upstream release rewrites that branch (main + one commit) and the
# PR in place; any older PR for the same pin is closed as superseded.
# Merging touches relays/**, and matrix.yml measures the bumped variants →
# new release → site rebuild → changelog entry. How soon depends on the
# token: a merge made with the workflow's own GITHUB_TOKEN starts no push run
# (GitHub does not create workflow runs for its pushes), so the bump is
# picked up by the next matrix run of any kind, at the latest the 6-hourly
# one that measures whatever changed since it was last measured. With
# BUMP_PAT the merge is the PAT user's and starts matrix.yml straight away.
#
# Tokens. For a PR opened (or a branch pushed) with the workflow's own
# GITHUB_TOKEN, GitHub creates the `pull_request` run of verify.yml but holds
# it as "action required" — a maintainer has to approve it (the "Approve and
# run" button on the PR, or POST /actions/runs/{id}/approve) before it runs.
# Nothing the bot can do with its own token releases it; in particular a
# `workflow_dispatch` of verify.yml on the branch does run, but its check
# runs are not part of the PR's status rollup, so branch protection ignores
# them (tried in #164). Two ways to get checks on the bot's PRs:
#
#   - default: a maintainer approves the held run; verify then reports on
#     the PR normally and auto-merge completes once the review is in. PRs
#     are authored by github-actions[bot], so the maintainer can approve
#     (review) them too.
#   - optional: set the repository secret BUMP_PAT to a fine-grained PAT with
#     contents: write and pull-requests: write on this repository and the bot
#     checks out, pushes and opens PRs with it; pull_request runs then start
#     without approval (the PRs are authored by that user).
#
# A PR that already names the right version is still rebuilt on the next run
# in two cases. It has gone CONFLICTING (a sibling pin in the same manifest
# merged first). Or main has changed the relay it bumps since the branch was
# built (scripts/bump-pr-stale.sh): the PR's checks ran against the older
# relay, and the bump itself may no longer be the whole change, as when a
# lock file for the manifest has arrived on main in the meantime. The rebuilt
# branch is a new commit, so its checks start over. Between two runs of this
# workflow such a PR can still merge on the checks it has.
name: bump-agents

on:
  schedule:
    - cron: '41 */6 * * *' # every 6 hours at :41 UTC
  workflow_dispatch:

# Two runs must not rewrite the same bump/* branch at once.
concurrency:
  group: bump-agents
  cancel-in-progress: false

permissions:
  contents: write      # push bump/* branches
  pull-requests: write # open/edit/close PRs, enable auto-merge
  issues: write        # gh label create (labels are shared with issues)

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      bumps: ${{ steps.find.outputs.bumps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - id: find
        env:
          GITHUB_TOKEN: ${{ github.token }} # github-releases lookups
        run: |
          set -euo pipefail
          go run ./cmd/cpm pins latest > bumps.json
          echo "bumps=$(jq -c . bumps.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Proposed bumps: $(jq length bumps.json)"
            jq -r '.[] | "- `\(.id)` (\(.kind)): \(.from) → \(.to)"' bumps.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    needs: discover
    if: needs.discover.outputs.bumps != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        bump: ${{ fromJson(needs.discover.outputs.bumps) }}
    env:
      ID: ${{ matrix.bump.id }}
      KIND: ${{ matrix.bump.kind }}
      FROM: ${{ matrix.bump.from }}
      TO: ${{ matrix.bump.to }}
      BRANCH: bump/${{ matrix.bump.id }}
      # The exact arrow matters: the title is how daily runs recognise an
      # up-to-date PR, and how superseded ones are found.
      TITLE: 'bump(${{ matrix.bump.id }}): ${{ matrix.bump.from }} → ${{ matrix.bump.to }}'
      # Dependabot's label for the pin's language (`cpm pins latest`, from
      # the variants it lists); empty when unknown.
      LABEL: ${{ matrix.bump.label }}
      # BUMP_PAT when set (see the header), else the workflow token.
      GH_TOKEN: ${{ secrets.BUMP_PAT || github.token }}
    steps:
      # Always branch from current main, whatever ref dispatched the run.
      # The token is persisted for `git push`, so pushes come from BUMP_PAT
      # when it is set (and so trigger `pull_request: synchronize`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # scripts/bump-pr-stale.sh: back to where the bump branch forked
          token: ${{ secrets.BUMP_PAT || github.token }}

      - name: Is the open PR for ${{ env.BRANCH }} already at ${{ env.TO }}, still mergeable, and built on this relay?
        id: existing
        env:
          FILES: ${{ toJson(matrix.bump.files) }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --state open --json number,title,mergeable --jq '.[0] // empty')
          number=$(jq -r '.number // empty' <<<"$pr")
          title=$(jq -r '.title // empty' <<<"$pr")
          mergeable=$(jq -r '.mergeable // empty' <<<"$pr")
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # What main has changed in the bumped relay since the branch was
          # built. Fails rather than answer "nothing" when it cannot tell.
          moved=""
          if [[ -n "$number" ]]; then
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            mapfile -t files < <(jq -r '.[]' <<<"$FILES")
            moved=$(MAIN=HEAD scripts/bump-pr-stale.sh "origin/$BRANCH" "${files[@]}")
          fi
          if [[ -n "$number" && "$title" == *"→ $TO" && "$mergeable" != "CONFLICTING" && -z "$moved" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::#$number ($title) already proposes $TO; nothing to do"
          else
            # No PR, a PR for an older version, a PR that conflicts with
            # main (a sibling pin in the same Dockerfile / go.sum merged
            # first), or one built before main changed its relay: rebuild
            # the branch on current main.
            [[ "$mergeable" == "CONFLICTING" ]] && echo "::notice::#$number conflicts with main; rebuilding"
            if [[ -n "$moved" ]]; then
              echo "::notice::#$number was built before main changed $(wc -l <<<"$moved" | tr -d ' ') file(s) of its relay, the first being $(head -1 <<<"$moved"); rebuilding"
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true
      # `cpm pins latest -apply` moves Cargo.lock with `cargo update` for the
      # Rust relays (as backtest.yml does for `cpm pins set`).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: steps.existing.outputs.skip != 'true' && matrix.bump.kind == 'cargo'
        with:
          toolchain: stable
      # ... and Gemfile.lock with `bundle lock` for the Ruby relays, under the
      # Ruby of the relay image (its FROM tag, so the two cannot drift): the
      # lock is resolved by the Ruby and Bundler that install it.
      - name: Ruby version of the relay image
        id: ruby
        if: steps.existing.outputs.skip != 'true' && matrix.bump.kind == 'bundler'
        run: sed -nE 's/^FROM ruby:([0-9.]+).*/version=\1/p' relays/ruby/Dockerfile >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        if: steps.existing.outputs.skip != 'true' && matrix.bump.kind == 'bundler'
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}

      - name: Apply ${{ env.ID }} ${{ env.FROM }} → ${{ env.TO }}
        if: steps.existing.outputs.skip != 'true'
        id: apply
        env:
          GITHUB_TOKEN: ${{ github.token }} # github-releases lookups
          # setup-go sets GOTOOLCHAIN=local for the job. A Go pin is moved
          # with `go get` and `go mod tidy` on the runner, which may need a
          # newer Go than go.mod names: let them fetch it.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go run ./cmd/cpm pins latest -only "$ID" -apply > /tmp/bump.json
          if [[ "$(jq length /tmp/bump.json)" == "0" ]]; then
            echo "::notice::$ID is already current on main; nothing to apply"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release between discover and apply moves the target; follow it.
          to=$(jq -r '.[0].to' /tmp/bump.json)
          if [[ "$to" != "$TO" ]]; then
            echo "::notice::$ID: discover saw $TO, apply found $to; using $to"
            echo "TO=$to" >> "$GITHUB_ENV"
            echo "TITLE=bump($ID): $FROM → $to" >> "$GITHUB_ENV"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat

      - name: Commit on bump/${{ env.ID }} and push
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch is always main + exactly one commit: (re)create it here.
          git checkout -B "$BRANCH"
          jq -r '.[0].files[]' /tmp/bump.json | xargs git add --
          if git diff --cached --quiet; then
            echo "::warning::$ID: pins latest reported a bump but nothing changed"; exit 0
          fi
          git commit -q -m "$TITLE"
          # bump/* branches are owned by this workflow: a newer upstream release
          # rewrites the branch on top of current main, so a force push is
          # expected here — for bump/* branches ONLY, nowhere else in this
          # repo. --force-with-lease refuses if the branch moved since we
          # fetched it (someone pushed to it by hand).
          if git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null; then
            git push --force-with-lease="$BRANCH" origin "$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi

      - name: Open or update the PR, enable auto-merge
        if: steps.apply.outputs.changed == 'true'
        id: pr
        env:
          EXISTING: ${{ steps.existing.outputs.number }}
          HAS_PAT: ${{ secrets.BUMP_PAT != '' }}
        run: |
          set -euo pipefail
          # Idempotent: the labels exist after the first run. The language
          # label is normally Dependabot's, created with its first PR for
          # that ecosystem; made here with Dependabot's wording in case a
          # tracer bump comes first (a fresh fork).
          gh label create tracer-bump --color 0E8A16 --description "Moves a tracer/agent pin; merged automatically when checks pass" 2>/dev/null || true
          gh label create auto-merge --color 5319E7 --description "Auto-merge enabled by a workflow" 2>/dev/null || true
          labels=dependencies,tracer-bump,auto-merge
          if [[ -n "$LABEL" ]]; then
            gh label create "$LABEL" --color EDEDED --description "Pull requests that update $LABEL code" 2>/dev/null || true
            labels+=",$LABEL"
          fi

          body=$(jq -r '.[0] |
            "Moves the **\(.id)** pin from `\(.from)` to `\(.to)`.\n\n" +
            "- Pin: `\(.id)` (kind `\(.kind)`)\n" +
            "- Files: " + (.files | map("`" + . + "`") | join(", ")) + "\n" +
            "- Variants re-measured: " + (.variants | map("`" + . + "`") | join(", ")) + "\n" +
            "- Source: `\(.source.registry)` / `\(.source.package)`" + (if .url then " — [registry](\(.url))" else "" end) +
            (if .releases_url then " · [releases](\(.releases_url))" else "" end) + "\n\n" +
            "Once merged, the next matrix run measures the listed variants and publishes a new release (within 6 hours; a bot merge does not start a run by itself).\n\n" +
            "_Opened by `bump-agents.yml` (`cpm pins latest -only \(.id) -apply`). A newer upstream release, or a change to this relay on main, rewrites this branch and PR in place; older PRs for the same pin are closed as superseded._"
          ' /tmp/bump.json)

          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$body" --add-label "$labels"
            pr=$EXISTING
            echo "updated #$pr"
          else
            url=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body" --label "$labels")
            pr=${url##*/}
            echo "opened #$pr ($url)"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          # Squash-merge once checks pass. Needs "Allow auto-merge" in the repo
          # settings and a branch protection / ruleset with required checks.
          gh pr merge --auto --squash "$pr" || echo "::notice::auto-merge not enabled on this repo yet"
          echo "- #$pr $TITLE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$HAS_PAT" != "true" ]]; then
            echo "::notice::#$pr: verify is held for approval (opened with GITHUB_TOKEN); approve the run on the PR or set BUMP_PAT"
          fi

      - name: Close PRs superseded by #${{ steps.pr.outputs.number }}
        if: steps.apply.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # Any OTHER open PR for this pin: the old `bump/<id>-<version>`
          # branch naming (the suffix must start with a digit, so `dd-trace-go`
          # does not match `bump/dd-trace-go-orchestrion-…`), or a title that
          # starts with `bump(<id>):`. Branches are left in place.
          gh pr list --state open -L 200 --json number,headRefName,title \
            | jq -r --arg id "$ID" --argjson cur "$PR" '
                .[] | select(.number != $cur)
                    | select(
                        ((.headRefName | startswith("bump/\($id)-"))
                          and (.headRefName[("bump/\($id)-" | length):] | test("^[0-9]")))
                        or (.title | startswith("bump(\($id)):")))
                    | .number' \
            | while read -r n; do
                echo "closing #$n (superseded by #$PR)"
                gh pr close "$n" --comment "Superseded by #$PR"
              done

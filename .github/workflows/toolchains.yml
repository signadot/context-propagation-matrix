# toolchains.yml — fail a PR when a language toolchain is pinned differently
# in a manifest and its Dockerfile (go.mod vs golang image, csproj
# TargetFramework vs dotnet images, pom.xml java.version vs temurin images).
# Dependabot bumps those sides independently; without this the mismatch only
# shows up when the matrix next runs. See scripts/check-toolchains.sh.
name: toolchains

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - 'docker/*.Dockerfile'
      - '**/go.mod'
      - 'relays/dotnet/*.csproj'
      - 'relays/java/pom.xml'
      - 'scripts/check-toolchains.sh'
      - '.github/workflows/toolchains.yml'
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - 'docker/*.Dockerfile'
      - '**/go.mod'
      - 'relays/dotnet/*.csproj'
      - 'relays/java/pom.xml'
      - 'scripts/check-toolchains.sh'
      - '.github/workflows/toolchains.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-toolchains.sh

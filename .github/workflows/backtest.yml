# backtest.yml — measure older tracer releases so the site can show when a
# cell changed (and auto-fill `fixed_in` on annotations).
#
# For each (variant, older version) pair from `cpm discover`: in the job's
# checkout, move the pin behind that variant to the older version (`cpm pins
# set` — the same edit to go.mod / package.json / requirements / Gemfile /
# Cargo.toml / Dockerfile ARG that a Dependabot PR makes, pointed backwards),
# build the relay with the unchanged Dockerfile,
# run the 16 hops, aggregate a single-variant results.json with
# kind=backtest, and publish it as pre-release `backtest-<variant>-<version>`.
# A final job then files each document under its version in the variant's
# rolling `variant-<id>` release (scripts/publish-versions.sh), which is what
# the site reads per version, and asks Netlify to rebuild the site so the
# new documents are shown.
# `cpm gate` stands between the aggregate and the release: a leaked canary or
# a hop over the wrong protocol publishes nothing, and an agent that did not
# attach (judged against the uninstrumented relay in the latest run) is
# published and filed with `invalid: agent_inactive` in the document.
# Pairs already measured — filed in the variant's release by a matrix run or
# a back-test, or with a backtest-* release — are skipped, so re-runs only
# fill gaps; dispatch with `refresh` to measure them again (after a
# matrix_version bump or a relay change), which replaces each release's
# assets and re-files the version. Versions a pin's `backtest` policy in
# pins.yaml rules out (too old to build, never shipped for the whole family)
# are never proposed. `depth` is a window over each tracer's release history
# (the newest N versions older than the current pin): 5 on the schedule
# keeps up with ordinary bumps; a large depth back-fills further, 250 pairs
# per dispatch (GitHub's matrix cap) spread round-robin across variants, so
# dispatching again continues where the last run stopped.
# Nothing is committed; the matrix measures whatever main pins.
name: backtest

on:
  schedule:
    - cron: '23 3 1 * *' # monthly, 1st at 03:23 UTC
  workflow_dispatch:
    inputs:
      variants:
        description: 'Comma-separated variant ids (default: every public variant)'
        required: false
        default: ''
      depth:
        description: 'How many older versions per variant'
        required: false
        default: '5'
      include_secret:
        description: 'Include variants that need a secret (New Relic)'
        type: boolean
        default: true
      refresh:
        description: 'Measure every pair again, even those with a release (after a matrix_version bump or a relay change)'
        type: boolean
        default: false

concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CACHE_IMAGE: ghcr.io/${{ github.repository }}/cache

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.plan.outputs.pairs }}
      count: ${{ steps.plan.outputs.count }}
      baseline: ${{ steps.baseline.outputs.artifact-id != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # discover excludes the version the matrix currently measures; that
      # comes from the latest published results.json, which is a release
      # asset, not a tracked file.
      - name: Fetch results.json from the latest run-* release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-latest.sh
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On the schedule (no inputs) New Relic is included and nothing is
          # refreshed; a dispatch can change either.
          args=(-depth "${{ github.event.inputs.depth || '5' }}")
          [[ "${{ github.event.inputs.refresh }}" == "true" ]] || args+=(-skip-published)
          [[ -n "${{ github.event.inputs.variants }}" ]] && args+=(-variants "${{ github.event.inputs.variants }}")
          [[ "${{ github.event.inputs.include_secret || 'true' }}" == "true" ]] && args+=(-include-secret)
          go run ./cmd/cpm discover "${args[@]}" > pairs.json
          echo "pairs=$(jq -c . pairs.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length pairs.json)" >> "$GITHUB_OUTPUT"
          echo "### Back-test plan: $(jq length pairs.json) builds" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.variant) @ \(.version) (current \(.current))"' pairs.json >> "$GITHUB_STEP_SUMMARY"
      # The same results.json is every pair's baseline: a back-test document
      # holds one variant, and whether its agent attached is judged against
      # the uninstrumented relay of that language in the latest run. Handed on
      # as an artifact rather than fetched by each pair: finding the latest
      # run pages through every release (over a thousand), and up to 250 jobs
      # doing that would take API budget the publish steps need. It also
      # gives every pair of one dispatch the same baseline. Nothing is
      # uploaded before the first run-* release; the gate then says it had
      # no baseline.
      - id: baseline
        name: Keep that results.json as the baseline for every pair
        uses: actions/upload-artifact@v4
        with:
          name: latest-run-results
          path: results/latest/results.json
          if-no-files-found: ignore
          # As long as the relay logs below, so a pair re-run later still
          # finds its baseline.
          retention-days: 30

  run:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # A pair is ~5 min warm, so a full 250-pair dispatch is ~1 h at 30 wide
      # (~3.5 h at the previous 6). The plan allows 60 concurrent jobs; 30
      # leaves room for verify.yml on PRs and a matrix run alongside.
      max-parallel: 30
      matrix:
        pair: ${{ fromJson(needs.plan.outputs.pairs) }}
    env:
      V: ${{ matrix.pair.variant }}
      VER: ${{ matrix.pair.version }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      # The latest run's results.json from the plan job; empty when there is none.
      BASELINE: ${{ needs.plan.outputs.baseline == 'true' && '/tmp/baseline/results.json' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `cpm pins set` moves Cargo.lock with `cargo update` for the Rust relays.
      - uses: dtolnay/rust-toolchain@stable
        if: endsWith(env.V, '-rust')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ env.V }}'s tracer to ${{ env.VER }} in this checkout
        run: |
          set -euo pipefail
          go run ./cmd/cpm pins set -variant "$V" -version "$VER" > /tmp/pin.json
          echo "### Pinned" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"`\(.id)` (\(.kind)) \(.from) → \(.to) in " + (.files | map("`" + . + "`") | join(", "))' /tmp/pin.json >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat
      - name: Build relay-${{ env.V }} from the pinned checkout
        run: |
          set -euo pipefail
          args=(--load)
          for t in sink driver; do
            args+=(--set "$t.tags=cpmatrix-$t" --set "$t.cache-from=type=registry,ref=$CACHE_IMAGE:$t")
          done
          # Cache reads from the current-version layers help (base image, app
          # deps; the per-Dockerfile ref has the language's shared stages); we
          # do not write back so the main cache stays for HEAD.
          df=$(docker buildx bake -f docker-compose.yml --print "relay-$V" | jq -r ".target[\"relay-$V\"].dockerfile")
          args+=(--set "relay-$V.tags=cpmatrix-relay-$V"
                 --set "relay-$V.cache-from=type=registry,ref=$CACHE_IMAGE:relay-$V"
                 --set "relay-$V.cache-from=type=registry,ref=$CACHE_IMAGE:$(dirname "$df" | tr / -)")
          docker buildx bake -f docker-compose.yml "${args[@]}" sink driver "relay-$V"
      - name: Run the 16 hops (retry once on driver failure)
        run: |
          set -euo pipefail
          mkdir -p results/raw results/data
          docker compose up -d --no-build kafka rabbitmq sink
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "relay-in-$V" --partitions 1 --replication-factor 1
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic sink-in --partitions 1 --replication-factor 1
          docker compose up -d --no-build "relay-$V"
          if [[ "$V" == newrelic-* ]]; then sleep 5; docker compose run --rm --pull never driver -variant "$V" >/dev/null 2>&1 || true; sleep 10; fi
          # The single retry matrix.yml has. The driver fails when the relay
          # never became ready or no hop was delivered; it does not fail when
          # only some hops time out, so this does not catch a partly failed run.
          docker compose run --rm --pull never driver -variant "$V" || {
            echo "::warning::driver failed once for $V @ $VER; retrying"
            docker compose restart "relay-$V"; sleep 5
            docker compose run --rm --pull never driver -variant "$V"
          }
      # Saved before anything that can fail, so a result can be traced to what
      # the relay and its agent printed (an agent that refused to attach says
      # so here and nowhere else).
      - name: Relay + sink logs
        if: always()
        run: docker compose logs --no-color "relay-$V" sink > "relay-$V.log" 2>&1 || true
      - name: Keep the logs (also when nothing is published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-backtest-${{ env.V }}-${{ env.VER }}
          path: relay-${{ env.V }}.log
          if-no-files-found: warn
          retention-days: 30
      - name: Latest run's results.json (the uninstrumented baseline to judge this agent against)
        if: env.BASELINE != ''
        uses: actions/download-artifact@v4
        with:
          name: latest-run-results
          path: /tmp/baseline
      - name: Aggregate a single-variant results.json (kind=backtest)
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw && cp "results/raw/$V.json" /tmp/raw/
          go run ./cmd/cpm aggregate -raw /tmp/raw -out /tmp/out -kind backtest -commit "$GITHUB_SHA" \
            -run-id "backtest-$V-$VER" -notes "pinned $(jq -r .id /tmp/pin.json) to $VER via cpm pins set" \
            ${BASELINE:+-baseline "$BASELINE"}
          # The relay must have run the version we asked for: the document is
          # filed under $VER, so a mismatch would publish cells under a version
          # they did not measure (shared Go modules once built otel-go 1.40–1.43
          # at 1.44.0; `go mod tidy` pulled 1.27.0–1.30.0 back to 1.47.0 — the
          # 2026-11-10 back-tests of those four were filed wrong, and this check
          # was only a warning). The reported string may carry a `v`
          # prefix or extra words (`open-telemetry/sdk 1.15.0 (ext-opentelemetry
          # 1.5.0)`); the requested version has to be one of its tokens.
          reported=$(jq -r --arg v "$V" '.variants[] | select(.id==$v) | .tracer.version // "unknown"' /tmp/out/results.json)
          echo "relay reported tracer version: $reported (requested $VER)"
          if ! tr ' ()' '\n\n\n' <<<"$reported" | sed 's/^v//' | grep -qxF -- "$VER"; then
            echo "::error::relay reported tracer version \"$reported\", requested $VER — the build did not pin $V's tracer (check the pins.yaml entry and the relay's module manifest); not publishing"
            exit 1
          fi
      # A leaked canary or a hop over the wrong protocol is a fault of the
      # relay or the harness: the job fails, nothing is published or filed, and
      # the next sweep proposes the pair again. An agent that did not attach
      # only warns. The document is published and filed carrying
      # `invalid: agent_inactive`, because "this version does not attach on
      # today's stack" is worth recording once, and a pair with neither a
      # release nor an index entry would be measured again by every sweep.
      - name: Gate (refuse a canary leak or a wrong transport; record an agent that did not attach)
        run: go run ./cmd/cpm gate ${BASELINE:+-baseline "$BASELINE"} /tmp/out/results.json
      - name: Publish release backtest-${{ env.V }}-${{ env.VER }}
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release so the Releases page leads with runs; the data is as
        # good as any run's, and the variant-* release files it by version.
        run: |
          set -euo pipefail
          tag="backtest-$V-$VER"
          assets=(/tmp/out/results.json /tmp/out/MATRIX.md "results/raw/$V.json#raw-$V.json" "relay-$V.log")
          if gh release view "$tag" >/dev/null 2>&1; then
            # A refresh: the release stays, its assets are replaced.
            gh release upload "$tag" --clobber "${assets[@]}"
            gh release edit "$tag" --notes "Back-test of \`$V\` with tracer version \`$VER\` (kind=backtest), re-measured $(date -u +%F) at $GITHUB_SHA. See the run's results.json for cells." >/dev/null
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "backtest: $V @ $VER" --prerelease \
              --notes "Back-test of \`$V\` with tracer version \`$VER\` (kind=backtest). See the run's results.json for cells." \
              "${assets[@]}"
          fi
      - name: Keep the document for the filing job
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ env.V }}-${{ env.VER }}
          path: /tmp/out/results.json
          retention-days: 3
      - name: Relay logs (on failure)
        if: failure()
        run: docker compose logs --no-color "relay-$V" sink | tail -200

  # One job, after every pair, so two back-tests of the same variant never
  # update its variant-* release at the same time.
  file:
    name: File each back-test under its tracer version (variant-* releases)
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: backtest-*
          path: docs
      - id: file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          filed=0
          for doc in docs/backtest-*/results.json; do
            # The document knows its variant; its run id is backtest-<variant>-<version>.
            v=$(jq -r '.variants[] | select(.missing | not) | .id' "$doc")
            ver=$(jq -r --arg v "$v" '.run.run_id | ltrimstr("backtest-" + $v + "-")' "$doc")
            if scripts/publish-versions.sh -version "$ver" "$doc" "$v"; then filed=$((filed + 1)); else failed=1; fi
          done
          echo "filed=$filed" >> "$GITHUB_OUTPUT"
          exit $failed
      # The site reads the variant-* releases at build time, so without this
      # the documents filed above are not shown until something else rebuilds it.
      # Also when some filings failed: the others are published.
      - name: Rebuild contextpropagation.io
        if: always() && steps.file.outputs.filed != '' && steps.file.outputs.filed != '0' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [[ -z "$HOOK" ]]; then echo "::notice::NETLIFY_BUILD_HOOK_URL not set; site not rebuilt"; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=backtest-${{ github.run_id }}"

# verify.yml — pull-request gate. Works without secrets, so PRs from forks pass
# everything except the New Relic relays (which need a licence key to boot).
#
# Four checks, named after what they do (these names are what branch
# protection requires, so keep them stable):
#
#   "Go: gofmt, vet, test"
#   "Registry, pins, annotations and scripts consistent"
#       variants.yaml ↔ docker-compose.yml ↔ annotations/*.yaml ↔ the latest
#       published results.json agree; every tracer pin in pins.yaml resolves;
#       shell scripts parse.
#   "Boot and propagate: <variant>"  (one per smoked variant; not required)
#       build the relay from the GHCR layer cache, run the 16 hops against
#       real brokers, check the driver recorded all 16 and leaked no canary.
#   "Affected relays build, boot and propagate"
#       the stable gate over the per-variant jobs above: fails if any of them
#       failed, passes when none was needed.
#
# Which relays are smoked: the ones `cpm affected` says the change can alter
# (a tracer bump boots exactly the variant it moves). A change to shared code
# (driver, sink, proto, workflows) affects every variant; smoking 47 relays on
# every such PR is the matrix run's job, not the gate's, so above
# SMOKE_CAP variants the gate falls back to a representative pair instead.
#
# workflow_dispatch exists for bump-agents.yml: branches it pushes with the
# workflow's own token raise no pull_request event (GitHub's recursion
# guard), so it dispatches this workflow on the bump/* branch instead. The
# check runs land on the branch's head commit, which is the PR's head, so
# they count for branch protection like any other run. The change is diffed
# against the branch's merge-base with main, as for a pull request.
name: verify

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # write: the smoke jobs push the GHCR layer cache for same-repo branches.
  # Fork PRs get a read-only token regardless, and CAN_PUSH_CACHE skips cache-to.
  packages: write

env:
  CACHE_IMAGE: ghcr.io/${{ github.repository }}/cache
  # Above this many affected variants, smoke the representative pair instead.
  SMOKE_CAP: 6
  # One zero-code agent and one in-code SDK, both quick to build.
  SMOKE_REPRESENTATIVE: otel-node datadog-python

jobs:
  go:
    name: "Go: gofmt, vet, test"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./driver ./sink ./matrixgen)" || { gofmt -l ./cmd ./internal ./driver ./sink ./matrixgen; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  consistency:
    name: "Registry, pins, annotations and scripts consistent"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Results are not in the tree: pull the latest published run so the
      # annotation selectors are checked against real cells. Before the first
      # release this is a no-op and validate skips that check.
      - name: Fetch results.json from the latest run-* release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-latest.sh
      # Pull requests are strict: an annotation whose cells all pass (or whose
      # explicit outcome no longer occurs) must be marked fixed in the same
      # review. The scheduled matrix run stays non-strict so an upstream fix
      # can never stop results from being published.
      - name: variants.yaml, docker-compose.yml and annotations agree
        run: go run ./cmd/cpm validate -results results/latest/results.json ${{ github.event_name != 'push' && '-strict' || '' }}
      # Every tracer pin listed in pins.yaml resolves in its file, and every
      # instrumented variant has exactly one pin (what backtest.yml and
      # bump-agents.yml move). Offline.
      - name: pins.yaml matches the manifests and the registry
        run: go run ./cmd/cpm pins check >/dev/null
      - name: shell scripts parse
        run: for f in run.sh scripts/*.sh; do bash -n "$f" || exit 1; done
      # matrix.yml carries results over from the release this names and diffs
      # against it, and republish.yml rewrites it. The releases API does not
      # list runs newest first, so the choice is tested. Offline.
      - name: fetch-latest.sh names the newest run
        run: scripts/test-fetch-latest.sh

  plan:
    name: "Which relays does this change affect?"
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # cpm affected diffs two revisions
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        env:
          HAS_NR: ${{ secrets.NEW_RELIC_LICENSE_KEY != '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # setup-go registers a problem matcher for `<file>.go: <message>`
          # lines. `cpm affected` prints its reasons in that shape (`affected:
          # cmd/cpm/main.go: aggregation/tooling only, no variants`), and the
          # matcher would file each one as an error annotation on this job.
          echo "::remove-matcher owner=go::"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Diff from where the branch forked, not from the base branch's
              # current tip, so unrelated merges to main do not widen the set.
              base=$(git merge-base "$PR_BASE" "$PR_HEAD")
              head="$PR_HEAD"
              ;;
            workflow_dispatch)
              # Dispatched on a bump/* branch by bump-agents.yml: same idea,
              # the branch's fork point from main.
              base=$(git merge-base origin/main "$GITHUB_SHA")
              head="$GITHUB_SHA"
              ;;
            *)
              base="$PUSH_BEFORE"
              head="$GITHUB_SHA"
              ;;
          esac
          affected=$(go run ./cmd/cpm affected -base "$base" -head "$head" | sort -u)
          n=$(echo "$affected" | sed '/^$/d' | wc -l | tr -d ' ')
          if (( n == 0 )); then
            echo "::notice::no relay is affected by this change; nothing to smoke"
            selected=""
          elif (( n > SMOKE_CAP )); then
            echo "::notice::$n variants affected (shared code changed); smoking the representative pair instead — the matrix run after merge covers them all"
            # Sorted: comm below rejects unsorted input.
            selected=$(printf '%s\n' $SMOKE_REPRESENTATIVE | sort)
          else
            selected="$affected"
          fi
          if [[ "$HAS_NR" != "true" && -n "$selected" ]]; then
            # Fork PRs have no secrets; their New Relic relays cannot boot here.
            secret=$(go run ./cmd/cpm list -secret | sort)
            dropped=$(comm -12 <(echo "$selected") <(echo "$secret") | tr '\n' ' ')
            [[ -n "$dropped" ]] && echo "::notice::NEW_RELIC_LICENSE_KEY not available to this run; not smoking: $dropped"
            selected=$(comm -23 <(echo "$selected") <(echo "$secret"))
          fi
          echo "variants=$(echo "$selected" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "smoking: $(echo $selected)"

  smoke:
    name: "Boot and propagate: ${{ matrix.variant }}"
    needs: plan
    if: needs.plan.outputs.variants != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.plan.outputs.variants) }}
    env:
      V: ${{ matrix.variant }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR (cache read/write; skipped for forks)
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build sink, driver and relay-${{ matrix.variant }} (GHCR layer cache)
        env:
          CAN_PUSH_CACHE: ${{ github.event.pull_request.head.repo.fork != true }}
        run: |
          set -euo pipefail
          # Same cache refs as matrix.yml: per variant plus per relay Dockerfile
          # (relays/node/Dockerfile → relays-node) so a language's app build is shared.
          df=$(docker buildx bake -f docker-compose.yml --print "relay-$V" | jq -r ".target[\"relay-$V\"].dockerfile")
          lang_ref="$CACHE_IMAGE:$(dirname "$df" | tr / -)"
          args=(--load)
          for t in sink driver "relay-$V"; do
            args+=(--set "$t.tags=cpmatrix-$t" --set "$t.cache-from=type=registry,ref=$CACHE_IMAGE:$t")
            if [[ "$CAN_PUSH_CACHE" == "true" ]]; then
              args+=(--set "$t.cache-to=type=registry,ref=$CACHE_IMAGE:$t,mode=max")
            fi
          done
          args+=(--set "relay-$V.cache-from=type=registry,ref=$lang_ref")
          if [[ "$CAN_PUSH_CACHE" == "true" ]]; then
            args+=(--set "relay-$V.cache-to=type=registry,ref=$lang_ref,mode=max")
          fi
          docker buildx bake -f docker-compose.yml "${args[@]}" sink driver "relay-$V"
      - name: Start brokers, sink and the relay
        run: |
          set -euo pipefail
          mkdir -p results/raw results/data
          docker compose up -d --no-build kafka rabbitmq sink
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "relay-in-$V" --partitions 1 --replication-factor 1
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic sink-in --partitions 1 --replication-factor 1
          docker compose up -d --no-build "relay-$V"
      # Same as matrix.yml: the New Relic agents only propagate after a
      # handshake with the backend, so warm them with a throwaway pass.
      - name: Prime (agents that need a backend handshake before propagating)
        if: startsWith(matrix.variant, 'newrelic-')
        run: |
          sleep 5
          docker compose run --rm --pull never driver -variant "$V" >/dev/null 2>&1 || true
          sleep 10
      - name: Run the 16 hops
        run: docker compose run --rm --pull never driver -variant "$V"
      - name: Assert 16 hops recorded, canary clean
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open(f"results/raw/{os.environ['V']}.json"))
          hops = d["tests"]
          assert len(hops) == 16, f"expected 16 hops, got {len(hops)}"
          leaks = [t["boundary"] for t in hops if t.get("status") and t["status"]["canary_leak"]]
          assert not leaks, f"canary leaked on {leaks}"
          delivered = sum(1 for t in hops if t["delivered"])
          print(f"ok: {delivered}/16 hops delivered")
          EOF
      - name: Relay logs (on failure)
        if: failure()
        run: docker compose logs --no-color "relay-$V" sink | tail -200

  gate:
    # The one smoke check branch protection can require: matrix job names
    # carry the variant and change from PR to PR, this one does not.
    name: "Affected relays build, boot and propagate"
    needs: [plan, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SMOKE: ${{ needs.smoke.result }}
          VARIANTS: ${{ needs.plan.outputs.variants }}
        run: |
          echo "plan: $PLAN; smoke: $SMOKE; variants: $VARIANTS"
          [[ "$PLAN" == "success" ]] || { echo "::error::could not work out which relays this change affects"; exit 1; }
          case "$SMOKE" in
            success) echo "all smoked relays booted and propagated" ;;
            skipped) echo "no relay affected; nothing to smoke" ;;
            *)       echo "::error::a smoked relay failed — see the 'Boot and propagate' jobs"; exit 1 ;;
          esac

# Dependabot keeps the context-propagation-matrix harness pinned to exact,
# current versions: every manifest pins exact versions and Dependabot opens
# PRs to bump them. After merging a bump that touches a tracer/agent, re-run
# the affected variants and regenerate results/MATRIX.md (see DESIGN.md
# "Version pinning").
#
# NOT covered by Dependabot — bumped by .github/workflows/bump-agents.yml from
# versions/agents.yaml, which also re-runs the affected variants:
#   - Java agent jars           (relays/java/Dockerfile ARGs)
#   - .NET profiler tarballs    (relays/dotnet/Dockerfile ARGs)
#   - PHP agents + OTel ext     (relays/php/Dockerfile ARGs / pinned requires)
#
# Grouping: per manifest, everything that is NOT a tracer/agent package lands
# in one "app-deps" PR (clients, frameworks, build tooling). Tracer packages
# stay one-PR-per-package so a merge maps to exactly one variant to re-run.
# Each ecosystem's exclude-patterns list only the tracer packages that
# ecosystem's manifests actually pull in (Dependabot has no anchors or shared
# group definitions; `pattern` matching is per package name within one
# ecosystem). Adding a tracer package to a manifest means adding it here too.
# Ecosystems whose agents come from Dockerfile ARGs (composer, maven, nuget)
# have no tracer packages to exclude, so everything there is app-deps.
version: 2

updates:
  # Go: the root module (driver, sink, matrixgen) plus one module per Go
  # relay flavour — hand-wired contribs (relays/go), Orchestrion build-time
  # weaving (relays/go-orchestrion, which pins orchestrion + dd-trace-go), and
  # otelc build-time weaving (relays/go-otelc, which pins otelc via the go.mod
  # `tool` directive).
  - package-ecosystem: gomod
    directories:
      - /
      - /relays/go
      - /relays/go-orchestrion
      - /relays/go-otelc
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "github.com/DataDog/*"        # dd-trace-go, orchestrion
          - "go.opentelemetry.io/*"       # otel, contrib, otelc
          - "github.com/newrelic/*"       # go-agent + integrations
          - "go.elastic.co/*"             # apm + modules

  # Node: app deps + one single-dependency manifest per tool target.
  - package-ecosystem: npm
    directories:
      - /relays/node
      - /relays/node/tools/otel
      - /relays/node/tools/datadog
      - /relays/node/tools/newrelic
      - /relays/node/tools/elastic
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "dd-trace"
          - "@opentelemetry/*"
          - "newrelic"
          - "elastic-apm-node"

  # Python: requirements.txt (app) + requirements-<tool>.txt (agents),
  # all picked up from the same directory.
  - package-ecosystem: pip
    directory: /relays/python
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "ddtrace"
          - "opentelemetry-*"
          - "newrelic"
          - "elastic-apm"

  # Ruby: one Gemfile per tool target.
  - package-ecosystem: bundler
    directories:
      - /relays/ruby/gemfiles/none
      - /relays/ruby/gemfiles/otel
      - /relays/ruby/gemfiles/datadog
      - /relays/ruby/gemfiles/newrelic
      - /relays/ruby/gemfiles/elastic
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "datadog"
          - "opentelemetry-*"
          - "newrelic_rpm"
          - "elastic-apm"

  # PHP: app composer.json (agents are installed in the Dockerfile — manual).
  - package-ecosystem: composer
    directory: /relays/php
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # Java: pom.xml app deps (agent jars are Dockerfile ARGs — manual).
  - package-ecosystem: maven
    directory: /relays/java
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # .NET: csproj app deps (agents are Dockerfile ARGs — manual).
  - package-ecosystem: nuget
    directory: /relays/dotnet
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # Rust: Cargo.toml + committed Cargo.lock (includes both tracer crates).
  - package-ecosystem: cargo
    directory: /relays/rust
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "opentelemetry*"              # opentelemetry, opentelemetry_sdk, opentelemetry-http
          - "datadog-opentelemetry"

  # Base images in every Dockerfile. Language toolchain images are checked
  # against their manifests by scripts/check-toolchains.sh. Two toolchains are
  # pinned in more than one place, and Dependabot only sees the Docker tags,
  # so a major bump from it can never pass that check:
  #   .NET  dotnet/sdk + dotnet/aspnet must move with Relay.csproj's
  #         TargetFramework (bump sdk, aspnet and the csproj together).
  #   Java  the maven builder image + the eclipse-temurin runtime image must
  #         move with pom.xml's <java.version> (bump all three together; the
  #         JVM is a measured parameter, so pick the LTS deliberately).
  # Their majors are left to a human.
  - package-ecosystem: docker
    directories:
      - /docker
      - /relays/go
      - /relays/go-orchestrion
      - /relays/go-otelc
      - /relays/java
      - /relays/node
      - /relays/python
      - /relays/dotnet
      - /relays/ruby
      - /relays/php
      - /relays/rust
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # maven:3.9-eclipse-temurin-N — the JDK is the suffix, so Dependabot
      # does not see its bump as a major; ignore the image outright. Build-
      # only, so the Maven version does not matter to the measurement.
      - dependency-name: "maven"

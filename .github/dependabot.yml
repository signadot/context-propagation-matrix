# Dependabot keeps the context-propagation-matrix harness's APP dependencies
# and toolchain images pinned to exact, current versions: clients,
# frameworks, build tooling, base images. It does not move tracers.
#
# Tracer/agent pins are NOT Dependabot's. Every one of them — Dockerfile ARGs,
# go.mod module families, package.json, requirements-*.txt, Gemfile,
# Cargo.toml — is listed in pins.yaml and moved by `cpm pins latest -apply`
# from .github/workflows/bump-agents.yml: one PR per pin (branch bump/<id>,
# labelled tracer-bump + auto-merge), rewritten in place when a newer
# release appears, auto-merged when checks pass, and the merge re-measures
# exactly that pin's variants (see DESIGN.md "Version pinning & updates").
# Each ecosystem below therefore `ignore`s the packages pins.yaml lists for
# it (gomod: the `modules:` of each family; the others: `packages:`), so
# Dependabot never opens a competing single-package PR. Adding a tracer
# package to pins.yaml means adding it to the matching ignore list here;
# `cpm pins check` (verify.yml) keeps pins.yaml itself honest.
#
# Deliberately NOT ignored, because pins.yaml does not list them (they carry
# their own version line, see the pins.yaml header) and nothing else would
# bump them: the OTel Go contrib modules (otelhttp/otelgrpc), the New Relic
# Go integrations (nrgrpc, nramqp, nrsarama), orchestrion itself, and the
# OTel Ruby instrumentation gems. Those stay Dependabot's.
#
# Grouping: per manifest, everything that is not a tracer/agent package lands
# in one "app-deps" PR. The exclude-patterns keep the tracer-adjacent
# packages above out of that group so each stays one PR per package and a
# merge maps to one variant to re-run (Dependabot has no anchors or shared
# group definitions; `pattern` matching is per package name within one
# ecosystem). Ecosystems whose agents come from Dockerfile ARGs (composer,
# maven, nuget) have no tracer packages, so everything there is app-deps.
version: 2

updates:
  # Go: the root module (driver, sink, matrixgen) plus one module per Go
  # relay — hand-wired contribs (relays/go/<tool>, one module per tracer so
  # pinning one never moves another), Orchestrion build-time weaving
  # (relays/go-orchestrion, which pins orchestrion + dd-trace-go), and otelc
  # build-time weaving (relays/go-otelc, which pins otelc via the go.mod
  # `tool` directive). Deliberately absent: gen and relays/go/internal, whose
  # requirements are floors shared by every relay module (see gen/go.mod).
  - package-ecosystem: gomod
    directories:
      - /
      - /relays/go/otel
      - /relays/go/datadog
      - /relays/go/newrelic
      - /relays/go/elastic
      - /relays/go/none
      - /relays/go-orchestrion
      - /relays/go-otelc
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "github.com/DataDog/*"        # dd-trace-go, orchestrion
          - "go.opentelemetry.io/*"       # otel, contrib, otelc
          - "github.com/newrelic/*"       # go-agent + integrations
          - "go.elastic.co/*"             # apm + modules
    # pins.yaml `modules:` — moved by bump-agents.yml, family by family.
    ignore:
      - dependency-name: "go.opentelemetry.io/otel"                                    # otel-go
      - dependency-name: "go.opentelemetry.io/otel/sdk"                                # otel-go
      - dependency-name: "go.opentelemetry.io/otel/trace"                              # otel-go
      - dependency-name: "go.opentelemetry.io/otelc"                                   # otelc
      - dependency-name: "github.com/DataDog/dd-trace-go/v2"                           # dd-trace-go, dd-trace-go-orchestrion
      - dependency-name: "github.com/DataDog/dd-trace-go/contrib/net/http/v2"          # dd-trace-go
      - dependency-name: "github.com/DataDog/dd-trace-go/contrib/google.golang.org/grpc/v2" # dd-trace-go
      - dependency-name: "github.com/DataDog/dd-trace-go/contrib/IBM/sarama/v2"        # dd-trace-go
      - dependency-name: "github.com/DataDog/dd-trace-go/orchestrion/all/v2"           # dd-trace-go-orchestrion
      - dependency-name: "github.com/newrelic/go-agent/v3"                             # newrelic-go-agent
      - dependency-name: "go.elastic.co/apm/v2"                                        # elastic-apm-go
      - dependency-name: "go.elastic.co/apm/module/apmgrpc/v2"                         # elastic-apm-go
      - dependency-name: "go.elastic.co/apm/module/apmhttp/v2"                         # elastic-apm-go

  # Node: app deps + one single-dependency manifest per tool target.
  - package-ecosystem: npm
    directories:
      - /relays/node
      - /relays/node/tools/otel
      - /relays/node/tools/datadog
      - /relays/node/tools/newrelic
      - /relays/node/tools/elastic
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "dd-trace"
          - "@opentelemetry/*"
          - "newrelic"
          - "elastic-apm-node"
    # pins.yaml `packages:` — moved by bump-agents.yml.
    ignore:
      - dependency-name: "@opentelemetry/auto-instrumentations-node"  # otel-node
      - dependency-name: "dd-trace"                                   # dd-trace-node
      - dependency-name: "newrelic"                                   # newrelic-node
      - dependency-name: "elastic-apm-node"                           # elastic-apm-node

  # Python: requirements.in (app, compiled to requirements.txt by pip-compile)
  # + requirements-<tool>.txt (agents), all picked up from the same directory.
  - package-ecosystem: pip
    directory: /relays/python
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "ddtrace"
          - "opentelemetry-*"
          - "newrelic"
          - "elastic-apm"
    # pins.yaml `packages:` — moved by bump-agents.yml. opentelemetry-* is
    # the whole requirements-otel.txt family (distro + instrumentation-*),
    # which shares one version line.
    ignore:
      - dependency-name: "opentelemetry-*"   # otel-python
      - dependency-name: "ddtrace"           # ddtrace
      - dependency-name: "newrelic"          # newrelic-python
      - dependency-name: "elastic-apm"       # elastic-apm-python

  # Ruby: one Gemfile per tool target.
  - package-ecosystem: bundler
    directories:
      - /relays/ruby/gemfiles/none
      - /relays/ruby/gemfiles/otel
      - /relays/ruby/gemfiles/datadog
      - /relays/ruby/gemfiles/newrelic
      - /relays/ruby/gemfiles/elastic
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns:
          - "datadog"
          - "opentelemetry-*"
          - "newrelic_rpm"
          - "elastic-apm"
    # pins.yaml `packages:` — moved by bump-agents.yml. Only the SDK gem is
    # pinned; the opentelemetry-instrumentation-* gems have their own
    # versions and stay Dependabot's.
    ignore:
      - dependency-name: "opentelemetry-sdk"  # otel-ruby
      - dependency-name: "datadog"            # datadog-ruby
      - dependency-name: "newrelic_rpm"       # newrelic-ruby
      - dependency-name: "elastic-apm"        # elastic-apm-ruby

  # PHP: app composer.json (agents are installed in the Dockerfile — manual).
  - package-ecosystem: composer
    directory: /relays/php
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # Java: pom.xml app deps (agent jars are Dockerfile ARGs — manual).
  - package-ecosystem: maven
    directory: /relays/java
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # .NET: csproj app deps (agents are Dockerfile ARGs — manual).
  - package-ecosystem: nuget
    directory: /relays/dotnet
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]

  # Rust: one crate per tool (Cargo.toml + committed Cargo.lock) over the
  # shared source, relays/rust/README.md. One entry for all three crates, as
  # for Go and Ruby, so an application dependency moves in every crate in
  # the same PR: the application crates are the carriers under test (axum,
  # tonic, reqwest, rdkafka, lapin), and the three variants should never be
  # measured on different versions of them. The tracer crates are pins.yaml
  # `packages:` (and `follow`) — moved by bump-agents.yml (`cargo update`
  # for the whole family at once, which single-crate PRs cannot do).
  #
  # `ignore` is per entry, so the list is the union over the three crates.
  # For the baseline (relays/rust/none) that means its opentelemetry API and
  # HTTP-carrier crates, which are application dependencies there (no tracer
  # installed, the API's globals are no-ops), are not moved by Dependabot
  # either. That costs nothing in practice: an opentelemetry minor is an API
  # change to the shared source and has to land with the otel-rust pin (and,
  # through `follow`, the datadog-rust pin) in all three crates by hand; a
  # patch of a no-op API crate is not worth a PR per carrier bump.
  - package-ecosystem: cargo
    directories:
      - /relays/rust/otel
      - /relays/rust/datadog
      - /relays/rust/none
    schedule: { interval: weekly }
    groups:
      app-deps:
        patterns: ["*"]
        exclude-patterns: ["opentelemetry*", "datadog-opentelemetry"]
    ignore:
      - dependency-name: "opentelemetry"          # otel-rust; datadog-rust (follow)
      - dependency-name: "opentelemetry_sdk"      # otel-rust
      - dependency-name: "opentelemetry-http"     # otel-rust; datadog-rust (follow)
      - dependency-name: "datadog-opentelemetry"  # datadog-rust

  # Base images in every Dockerfile. Language toolchain images are checked
  # against their manifests by scripts/check-toolchains.sh. Two toolchains are
  # pinned in more than one place, and Dependabot only sees the Docker tags,
  # so a major bump from it can never pass that check:
  #   .NET  dotnet/sdk + dotnet/aspnet must move with Relay.csproj's
  #         TargetFramework (bump sdk, aspnet and the csproj together).
  #   Java  the maven builder image + the eclipse-temurin runtime image must
  #         move with pom.xml's <java.version> (bump all three together; the
  #         JVM is a measured parameter, so pick the LTS deliberately).
  # Their majors are left to a human.
  # relays/php pins php:8.3-apache by tag@digest and the extension installer by
  # exact version so its ~30 min gRPC compile stays cached between runs; the
  # digest and version bumps arrive here as PRs (see the Dockerfile header).
  - package-ecosystem: docker
    directories:
      - /docker
      - /relays/go
      - /relays/go-orchestrion
      - /relays/go-otelc
      - /relays/java
      - /relays/node
      - /relays/python
      - /relays/dotnet
      - /relays/ruby
      - /relays/php
      - /relays/rust
    schedule: { interval: weekly }
    # Dependabot names an image without its registry host: the .NET images
    # are `dotnet/sdk` and `dotnet/aspnet` in its log and its PR titles. A
    # rule under `mcr.microsoft.com/dotnet/...` matches nothing.
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # maven:3.9-eclipse-temurin-N — the JDK is the suffix, so Dependabot
      # does not see its bump as a major; ignore the image outright. Build-
      # only, so the Maven version does not matter to the measurement.
      - dependency-name: "maven"

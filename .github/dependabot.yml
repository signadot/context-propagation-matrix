          - "ddtrace"
          - "datadog*"
          - "github.com/DataDog/*"
          - "@opentelemetry/*"
          - "opentelemetry*"
          - "go.opentelemetry.io/*"
          - "newrelic*"
          - "github.com/newrelic/*"
          - "elastic-apm*"
          - "elastic_apm*"
          - "@elastic/*"
          - "go.elastic.co/*"
          - "Elastic.Apm*"
          - "OpenTelemetry*"
          - "NewRelic*"
          - "Datadog*"

  # Ruby: one Gemfile per tool target.
